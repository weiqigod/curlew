<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>curlew — runner &amp; inspector</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="at-tokens.css">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #151515; }
  #root { height: 100vh; min-width: 1180px; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="at-data.js"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="at-bits.jsx"></script>
<script type="text/babel" src="at-chrome.jsx"></script>
<script type="text/babel" src="at-runview.jsx"></script>
<script type="text/babel" src="at-inspector.jsx"></script>
<script type="text/babel" src="at-compare.jsx"></script>
<script type="text/babel" src="at-states.jsx"></script>
<script type="text/babel" src="at-app.jsx"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "light",
  "accent": "#6494e4",
  "density": "dense",
  "layout": "compact",
  "speed": 1,
  "failRate": 15,
  "appState": "normal"
}/*EDITMODE-END*/;

function Main() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  return (
    <React.Fragment>
      <AtApp tweaks={t} interactive />
      <TweaksPanel>
        <TweakSection label="Theme" />
        <TweakRadio label="Mode" value={t.theme} options={['dark', 'light']} onChange={(v) => setTweak('theme', v)} />
        <TweakColor label="Accent" value={t.accent} options={['#e9e9e9', '#6494e4', '#3aa8b8', '#9d85e8']} onChange={(v) => setTweak('accent', v)} />
        <TweakSection label="Layout" />
        <TweakRadio label="Density" value={t.density} options={['comfortable', 'dense', 'compact']} onChange={(v) => setTweak('density', v)} />
        <TweakRadio label="Run view" value={t.layout} options={['columns', 'lanes', 'compact']} onChange={(v) => setTweak('layout', v)} />
        <TweakSection label="Simulation" />
        <TweakSlider label="Run speed" value={t.speed} min={0.25} max={4} step={0.25} unit="×" onChange={(v) => setTweak('speed', v)} />
        <TweakSlider label="Failure rate" value={t.failRate} min={0} max={100} step={5} unit="%" onChange={(v) => setTweak('failRate', v)} />
        <TweakRadio label="Project state" value={t.appState} options={['normal', 'empty']} onChange={(v) => setTweak('appState', v)} />
      </TweaksPanel>
    </React.Fragment>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Main />);
</script>
</body>
</html>
