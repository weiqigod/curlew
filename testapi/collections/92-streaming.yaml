# Streams, read by a client that is not a streaming client.
#
# curlew reads a body to completion and asserts on the whole thing. That is what
# this collection measures rather than an obstacle to it.
#
# Text bodies used to be out of reach entirely (§11C.7): a body assertion parses
# the body as JSON, so every operator answered "response body is not valid JSON"
# against a text/event-stream, and `cel:` — the documented escape hatch — saw
# `response.body` as null because the decode was best-effort and left it there.
# A stream was assertable only by status, headers and timing.
#
# A body that is not JSON now has a root, and that root is its text: `$` with
# contains, matches, equals or length works on it, and `response.body` in CEL is
# the raw string. Deeper paths still fail, because there is no `$.foo` in a
# document with no structure. /stream/json/{n} remains, because a chunked JSON
# array is worth checking on its own terms.
#
# /stream/infinite is deliberately absent. curlew has no request timeout
# (§11.1), so a request to it would sit for the full 120-second server-side
# ceiling — two minutes of gate time to re-demonstrate a documented gap. It is
# covered by TestStream_InfiniteKeepsProducingAndIsBounded, which reads a few
# objects and hangs up the way a client with a timeout would.
name: Streaming and SSE
description: |
  Server-Sent Events with ids and a retry hint, resumption via Last-Event-ID,
  and chunked transfer with and without a JSON body.

requests:
  - name: an event stream is served without a length
    description: |
      No Content-Length is the header that makes the body chunked: a stream
      cannot declare a length it does not know.
    request:
      method: GET
      url: "{{mud}}/sse?events=3&ms=0"
    assertions:
      status: 200
      headers:
        Content-Type: { equals: "text/event-stream" }
        Cache-Control: { equals: "no-cache" }
        Content-Length: { exists: false }

  - name: an event stream's own text is assertable
    description: |
      This was §11C.7, and it lived in testapi/gaps/expected-failures.yaml
      because BOTH mechanisms failed on it:

        ✗ body $ contains: expected contains id: 1, got response body is not
          valid JSON
        ✗ cel: no such overload            (response.body was null)

      The consequence was never only SSE. An HTML error page, a CSV export, an
      XML SOAP response, plain text and NDJSON were all assertable by status
      and headers alone, and §9.K hit the same wall from the other side with
      its 500.

      Both routes are checked here on purpose: `$` covers the operator
      catalogue, `cel:` covers the escape hatch, and it was the escape hatch
      being broken too that made the gap total rather than merely awkward.
    request:
      method: GET
      url: "{{mud}}/sse?events=2&ms=0"
    assertions:
      status: 200
      body:
        # The event ids, anchored per line — the stream opens with its retry
        # hint, so an unanchored ^ would be matching the wrong thing.
        $: { matches: "(?m)^id: 1$" }
      cel:
        - 'response.body.contains("id: 1")'
        - 'response.body.contains("id: 2")'
        - 'response.body.contains("retry:")'

  - name: a deeper path into a text body still fails, and says why
    description: |
      The other half of the contract. `$.events[0]` does not address anything
      in a document with no structure, and answering "no match at path" would
      imply it could have. It stays an error — but the message now names the
      one thing that does work rather than being a dead end.

      Asserted through cel: because the failure itself is the subject; a body
      assertion here would fail the request.
    request:
      method: GET
      url: "{{mud}}/sse?events=2&ms=0"
    assertions:
      status: 200
      cel:
        # The body is a string, so it has no fields to reach into. This is the
        # positive statement of what "no deeper path" means.
        - 'type(response.body) == string'

  - name: a stream delivered over time still completes
    description: |
      Three events 40ms apart: a client that stopped at the first chunk returns
      in ~0ms, one that reads to completion takes at least 120.

      That distinction is only visible since §11C.6 was fixed. The reported
      duration used to stop when the headers arrived, so this request measured
      ~0ms however much body followed and the ceiling below asserted nothing at
      all. It now covers the read, which makes the ceiling a real bound.

      A ceiling alone cannot prove the stream was consumed — for that see the
      matching entry in testapi/gaps/expected-failures.yaml, where a 50ms
      ceiling against a one-second stream must FAIL. The two together are the
      evidence; this one on its own is a sanity bound.
    request:
      method: GET
      url: "{{mud}}/sse?events=3&ms=40"
    assertions:
      status: 200
      timing:
        max_duration_ms: 5000

  - name: Last-Event-ID is accepted as a resumption point
    description: |
      curlew has no SSE support, so it sets the header itself — the
      interesting half: the resumption protocol is expressible with the tools
      curlew does have, even though the events it resumes cannot be read.
    request:
      method: GET
      url: "{{mud}}/sse/reconnect"
      headers:
        Last-Event-ID: "2"
    assertions:
      status: 200
      headers:
        Content-Type: { equals: "text/event-stream" }

  - name: a malformed Last-Event-ID is refused
    description: |
      The negative control, and the one request in this family whose body IS
      assertable — because an error is JSON while a stream is not.
    request:
      method: GET
      url: "{{mud}}/sse/reconnect"
      headers:
        Last-Event-ID: "not-a-number"
    assertions:
      status: 400
      body:
        $.detail: { contains: "Last-Event-ID" }

  - name: newline-delimited JSON is served as a sequence
    description: |
      application/x-ndjson, not application/json: the body is four documents,
      and a client that treats it as one will fail to parse it. Which curlew
      does — see the gap file. Here only the framing is assertable.
    request:
      method: GET
      url: "{{mud}}/stream/4?ms=0"
    assertions:
      status: 200
      headers:
        Content-Type: { equals: "application/x-ndjson" }
        Content-Length: { exists: false }

  - name: a chunked JSON body arrives complete and parses
    description: |
      One JSON document written element by element, each flushed separately,
      so the body only becomes parseable when the last chunk lands. This is
      where chunked transfer is actually verified: every assertion below is
      about content that crossed the wire in pieces.
    request:
      method: GET
      url: "{{mud}}/stream/json/6?ms=5"
    assertions:
      status: 200
      headers:
        Content-Length: { exists: false }
      body:
        $.streamed: { equals: true }
        $.total: { equals: 6 }
        $.items: { length: 6 }
        $.items[0].seq: { equals: 1 }
        $.items[0].last: { equals: false }
        $.items[5].seq: { equals: 6 }
        $.items[5].last: { equals: true }

  - name: a long chunked body is not truncated
    request:
      method: GET
      url: "{{mud}}/stream/json/50?ms=2"
    assertions:
      status: 200
      timing:
        max_duration_ms: 8000
      body:
        $.items: { length: 50 }
        $.items[49].seq: { equals: 50 }

  - name: a schedule that would outlast the ceiling is refused
    description: |
      §6.4 caps any endpoint that can stall. n × ms is the one place a caller
      can ask this family to run for a week, and the refusal is a 400 rather
      than a stream nobody can stop.
    request:
      method: GET
      url: "{{mud}}/stream/1000?ms=1000"
    assertions:
      status: 400
      body:
        $.detail: { contains: "past the" }
