# Secrets, extracted where curlew will print them.
#
# This collection only fetches. The assertion that matters is on curlew's own
# output — a secret redacted in the terminal but present in the HTML report has
# still leaked — and that assertion lives in testapi/harness/redaction.sh, which
# runs this same file in every format and greps the artefacts.
#
# CLI_SPECIFICATION §6.5 lists eight surfaces: terminal, JSON, TAP, JUnit, HTML,
# Markdown, event streams and JSONL logs. Each is a separate code path.
name: Redaction bait
description: |
  Extracts realistic secrets from the /leak/* family by both routes to
  sensitivity — the §6.5 name heuristic and an explicit `sensitive: true` — then
  sends them back in a later request so they appear on the way out as well as on
  the way in.

requests:
  - name: extract a bearer token
    request:
      method: GET
      url: "{{mud}}/leak/token"
    assertions:
      status: 200
      body:
        $.access_token: { type: string }
        $.token_type: { equals: "Bearer" }
    extract:
      # Both names contain "token", so the §6.5 heuristic marks them sensitive
      # with no declaration. leaked_key below takes the other route.
      leaked_token: "$.access_token"
      leaked_refresh_token: "$.refresh_token"

  - name: extract a key from six levels down
    request:
      method: GET
      url: "{{mud}}/leak/nested"
    assertions:
      status: 200
      body:
        $.account.profile.integrations.provider.credentials.api_key: { type: string }
    extract:
      # The object form of CLI_SPECIFICATION §8. It is the only way to declare
      # sensitivity explicitly, and until it was implemented a value was
      # sensitive only if its name happened to match the heuristic — where the
      # name is whatever the API under test calls the field.
      leaked_key:
        path: "$.account.profile.integrations.provider.credentials.api_key"
        sensitive: true

  - name: a secret arriving in a response header
    request:
      method: GET
      url: "{{mud}}/leak/set-cookie"
    assertions:
      status: 200
      headers:
        Set-Cookie: { matches: "HttpOnly" }

  - name: a value matching no name heuristic
    request:
      method: GET
      url: "{{mud}}/leak/pan"
    assertions:
      status: 200
      body:
        $.card.brand: { equals: "visa" }
        $.card.number: { type: string }
    extract:
      # "card_number" contains none of password, token, secret, key, auth or
      # credential. Nothing about the name says secret; the declaration is the
      # only thing that can, which is exactly the case the object form exists
      # for.
      card_number:
        path: "$.card.number"
        sensitive: true

  - name: a secret carried only in a URL
    request:
      method: GET
      url: "{{mud}}/leak/in-url"
    assertions:
      # curlew follows redirects and offers no way not to (§11.2), so this
      # lands on /echo with the token as a query parameter. That is the
      # interesting outcome anyway: the secret is now in a request URL, which
      # every output surface records, and no body ever carried it.
      status: 200
      body:
        $.request.target: { contains: "access_token=" }

  - name: send the extracted token back
    request:
      method: GET
      url: "{{mud}}/leak/header-echo?ref={{card_number}}"
      headers:
        Authorization: "Bearer {{leaked_token}}"
        X-Api-Key: "{{leaked_key}}"
    assertions:
      status: 200
      body:
        # The echoed values are interpolated from sensitive variables, so
        # propagation (§6.5 rule 5) should keep them sensitive on the way back.
        $.authorization: { type: string }
