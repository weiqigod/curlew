# What the connection actually negotiated — and what cannot be asked.
#
# §9.N specifies nine TLS ports: valid chain, expired leaf, self-signed, wrong
# hostname, missing intermediate, client certificates, a TLS 1.2 ceiling,
# cleartext and h2c. §14.3 required one thing to be confirmed on the real
# toolchain before any of it was built, and it was measured rather than assumed:
#
#   CONTROL (explicit RootCAs):  TRUSTED — 200 OK
#   SSL_CERT_FILE:               FAILED — certificate signed by unknown authority
#   SSL_CERT_DIR:                FAILED — same
#   SSL_CERT_FILE + GODEBUG=x509usefallbackroots=1: FAILED
#
# on go1.25.5 darwin/arm64. The control passing is what makes it attributable:
# the certificates are fine, the trust mechanism is not. curlew has no CA option
# either (§11.3), so it cannot trust mudflat's CA by any route — and chain
# building fails before expiry, hostname or intermediate are considered, so all
# eight remaining postures would produce one identical error. Eight endpoints a
# client cannot tell apart is what §16 deletes.
#
# One TLS listener IS built and is verified by the package's own tests and by
# curl --cacert, which reports HTTP/2 over TLS 1.3. curlew's side of it — the
# failure is legible and classified as exit 4 — is in
# testapi/gaps/expected-failures.yaml, because a request that must fail cannot
# live in a passing collection.
name: Protocol reporting
description: |
  /protocol over cleartext. The TLS half of this family is measured by Go tests
  and by curl; see the header for why curlew cannot reach it.

requests:
  - name: a cleartext connection reports no TLS
    description: |
      tls: null is the assertion that matters. An endpoint that always reported
      a version would satisfy "tls exists" over cleartext too, and the TLS
      answer would then be worth nothing.
    request:
      method: GET
      url: "{{mud}}/protocol"
    assertions:
      status: 200
      body:
        $.http_version: { equals: "HTTP/1.1" }
        $.tls: { type: "null" }

  - name: HTTP/1.1 is what a cleartext client gets
    description: |
      Not HTTP/2. h2c — cleartext HTTP/2 — has no ALPN to negotiate with and
      needs an explicit upgrade that Go's client never sends, which is the
      precise shape of §11.4. Over TLS the same client negotiates h2 without
      asking, so the gap is narrower than "no HTTP/2": it is h2c specifically.
    request:
      method: GET
      url: "{{mud}}/protocol"
      headers:
        # An h2c upgrade offer, ignored by both sides. It is here so the
        # request records what was attempted.
        Upgrade: "h2c"
        Connection: "Upgrade, HTTP2-Settings"
        HTTP2-Settings: "AAMAAABkAAQAoAAAAAIAAAAA"
    assertions:
      status: 200
      body:
        $.http_version: { equals: "HTTP/1.1" }
        $.tls: { type: "null" }
