# Points the suite at a locally running mudflat. Nothing here reaches a network.
variables:
  mud: "http://127.0.0.1:8080"
  # The raw adversarial layer is a second listener on the structured port + 1.
  # It uses no HTTP library, so it cannot share a server with the other one.
  raw: "http://127.0.0.1:8081"
  # WebSocket needs its own variable: a protocol: websocket request is dialled
  # with gorilla, which requires a ws:// or wss:// URL and rejects http:// with
  # "malformed ws or wss URL". Same host and port as mud.
  ws: "ws://127.0.0.1:8080"
  # The TLS listener is the structured port + 2. curlew cannot trust its
  # per-process CA (§11.3), so only the gap collection uses this.
  tls: "https://127.0.0.1:8082"
