# Requests that MUST fail, because the server is deliberately broken.
#
# This is not a list of curlew defects. Every request here fails because mudflat
# sent something no client can succeed against, and the question each one asks is
# whether the resulting error is *legible* — does it name the cause, and is it
# classified so that retry rules treat it correctly?
#
# testapi/harness/gaps.sh runs this file and asserts the expected failure. An
# unexpected PASS fails the harness: a gap that closes must close visibly
# (specification §12.3).
name: "EXPECTED FAILURES: deliberately broken responses"
description: |
  Run by testapi/harness/gaps.sh, which asserts every request here fails and
  fails itself on an unexpected pass (§12.3).

variables:
  my_secret_token: "SENTINELVALUE123"

requests:
  - name: "a lying Content-Encoding is a decode error, not a network error"
    description: |
      expected-failure: this request cannot succeed, and should not.

      /encoding/lying/gzip declares Content-Encoding: gzip and sends plain
      bytes. No retry can fix that, so the two things worth checking are the
      message and the classification:

        response decoding error: the server declared Content-Encoding: gzip
        but the body is not valid gzip: gzip: invalid header

      It must NOT be reported as a network error and must NOT be retried under
      retry_on.network_errors — which this request enables precisely so that a
      regression putting it back in the network class shows up as three
      pointless attempts.

      Everything read off a response body used to be labelled a network error
      while not actually classifying as one, so the label was wrong in one
      direction and the retry behaviour in the other. See internal/httpexec:
      ErrDecode versus errors.NetworkError.
    request:
      method: GET
      url: "{{mud}}/encoding/lying/gzip"
    retry:
      enabled: true
      max_attempts: 3
      initial_delay_ms: 10
      backoff_strategy: constant
      retry_on:
        network_errors: true
    assertions:
      status: 200

  - name: "a sensitive value returned by the server is redacted"
    description: |
      expected-failure: this assertion is wrong on purpose. What it checks is
      what the failure message PRINTS.

      This request used to document a gap: redaction covered values on the way
      out but not on the way back, so the request line read

        > Authorization: [REDACTED]

      while the failure message printed the same value verbatim:

        ✗ body $.authorization equals: expected …, got Bearer SENTINELVALUE123

      It is fixed, and the request stays here inverted — the assertion still
      fails, but now the actual value must come back redacted. A gap that closes
      leaves behind the test that proves it stayed closed.

      Full surface coverage is in testapi/harness/redaction.sh; this is the
      minimal reproduction, kept because it is the one a developer can read.
    request:
      method: GET
      url: "{{mud}}/leak/header-echo"
      headers:
        Authorization: "Bearer {{my_secret_token}}"
    assertions:
      status: 200
      body:
        $.authorization: { equals: "this assertion fails so actual is printed" }

  - name: "a GraphQL full failure ignores error_handling: ignore"
    description: |
      gap: error_handling is inert for the full-failure outcome.

      docs/MANUAL.md §7.1 documents four outcomes and three modes as a matrix:

        | outcome          | fail | warn | ignore |
        | partial-success  | fail | warn | pass   |
        | full-failure     | fail | warn | pass   |

      Partial success honours the mode — verified in 90-graphql.yaml, where
      `ignore` and `warn` both pass against /graphql/partial. Full failure does
      not: /graphql/errors fails identically under fail, warn AND ignore.

      internal/runner/runner.go handles OutcomeFullFailure before the mode is
      consulted, under the comment "Full failure always fails regardless of
      mode (per spec)". docs/CLI_SPECIFICATION.md §12.2 does not say that; it
      describes the setting only in terms of partial success, and the manual's
      table says the opposite. One of the two documents is wrong about the
      shipped binary, which is the category §11A calls the more interesting one.

      The assertions below are the ones that cannot be written today. They are
      about the response document, not the outcome: `data: null` and an absent
      `data` are different documents, and $.data is addressable only in the
      first.
    request:
      protocol: graphql
      url: "{{mud}}/graphql/errors"
      graphql:
        query: "query ListUsers { users { id } }"
        error_handling: ignore
    assertions:
      status: 200
      body:
        $.data: { exists: true }
        $.errors[0].extensions.code: { equals: "GRAPHQL_VALIDATION_FAILED" }
