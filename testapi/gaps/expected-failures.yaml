# Requests that MUST fail, because the server is deliberately broken.
#
# This is not a list of curlew defects. Every request here fails because mudflat
# sent something no client can succeed against, and the question each one asks is
# whether the resulting error is *legible* — does it name the cause, and is it
# classified so that retry rules treat it correctly?
#
# testapi/harness/gaps.sh runs this file and asserts the expected failure. An
# unexpected PASS fails the harness: a gap that closes must close visibly
# (specification §12.3).
name: "EXPECTED FAILURES: deliberately broken responses"
description: |
  Run by testapi/harness/gaps.sh, which asserts every request here fails and
  fails itself on an unexpected pass (§12.3).

variables:
  my_secret_token: "SENTINELVALUE123"

requests:
  - name: "a lying Content-Encoding is a decode error, not a network error"
    description: |
      expected-failure: this request cannot succeed, and should not.

      /encoding/lying/gzip declares Content-Encoding: gzip and sends plain
      bytes. No retry can fix that, so the two things worth checking are the
      message and the classification:

        response decoding error: the server declared Content-Encoding: gzip
        but the body is not valid gzip: gzip: invalid header

      It must NOT be reported as a network error and must NOT be retried under
      retry_on.network_errors — which this request enables precisely so that a
      regression putting it back in the network class shows up as three
      pointless attempts.

      Everything read off a response body used to be labelled a network error
      while not actually classifying as one, so the label was wrong in one
      direction and the retry behaviour in the other. See internal/httpexec:
      ErrDecode versus errors.NetworkError.
    request:
      method: GET
      url: "{{mud}}/encoding/lying/gzip"
    retry:
      enabled: true
      max_attempts: 3
      initial_delay_ms: 10
      backoff_strategy: constant
      retry_on:
        network_errors: true
    assertions:
      status: 200

  - name: "a sensitive value returned by the server is redacted"
    description: |
      expected-failure: this assertion is wrong on purpose. What it checks is
      what the failure message PRINTS.

      This request used to document a gap: redaction covered values on the way
      out but not on the way back, so the request line read

        > Authorization: [REDACTED]

      while the failure message printed the same value verbatim:

        ✗ body $.authorization equals: expected …, got Bearer SENTINELVALUE123

      It is fixed, and the request stays here inverted — the assertion still
      fails, but now the actual value must come back redacted. A gap that closes
      leaves behind the test that proves it stayed closed.

      Full surface coverage is in testapi/harness/redaction.sh; this is the
      minimal reproduction, kept because it is the one a developer can read.
    request:
      method: GET
      url: "{{mud}}/leak/header-echo"
      headers:
        Authorization: "Bearer {{my_secret_token}}"
    assertions:
      status: 200
      body:
        $.authorization: { equals: "this assertion fails so actual is printed" }

  - name: "a GraphQL response that is not a GraphQL document fails only itself"
    description: |
      expected-failure: you asked for GraphQL and got HTML. Failing is right.

      This was §11C.1, and it used to live in its own file with its own harness
      category — testapi/gaps/graphql-http-error.run-abort.yaml — because the
      defect destroyed the very output this harness reads.
      /graphql/http-error answers 500 with an HTML error page, the ordinary
      case of a gateway that never reached the GraphQL service, and
      internal/runner returned an error instead of failing the one request:

        - the run ABORTED, reporting "requests": [] beside
          "summary": {"total": 8, "passed": 6} — the two contradicting each
          other, six passing requests discarded
        - the EXIT CODE was 5, which CLI_SPECIFICATION §17 assigns to variable
          resolution, so CI triaged a product problem as a pipeline
          misconfiguration
        - the MESSAGE was doubled: "parsing graphql response: parsing graphql
          response: invalid character '<'"

      All three are fixed, and the proof is that this entry can live here at
      all. If the abort ever comes back, gaps.sh gets no request results from
      this file and reports NOTHING EVALUATED — the run taking its own report
      down with it cannot look like a pass.
    request:
      protocol: graphql
      url: "{{mud}}/graphql/http-error"
      graphql:
        query: "query ListUsers { users { id } }"
        error_handling: ignore
    assertions:
      # Both of these now PASS — they are evaluated rather than skipped, which
      # they never were before. The request still fails overall, on the
      # GraphQL-level error that the body is not a GraphQL document, and that
      # is the outcome being recorded here.
      status: 500
      headers:
        Content-Type: { matches: "text/html" }

  - name: "a refused WebSocket upgrade reports its status and its body"
    description: |
      expected-failure: a refused upgrade cannot succeed, and should not. What
      this checks is what the failure message PRINTS.

      This was §11C.4. /ws/reject answers 426 Upgrade Required with a JSON body
      explaining itself, and curlew reported only:

        websocket dial failed: websocket: bad handshake

      No status, no body, no headers — so 426, 401, 403 and 500 were
      indistinguishable, and the one thing a server can do to explain a refused
      upgrade was discarded. gorilla hands the response back alongside
      ErrBadHandshake, having already read up to 1024 bytes of the body into
      it; the dialer threw it away with `conn, _, err :=`.

      It now reports:

        websocket dial failed: server refused the upgrade with 426 Upgrade
        Required; body: { "detail": "this endpoint refuses every upgrade on
        purpose", "error": "Upgrade Required", "note": "a client should report
        the 426 and this body, not a bare dial failure" }
        (websocket: bad handshake)

      — which is the endpoint's own stated acceptance criterion, quoted back
      from the body it sends. §9.L asked for "a legible error naming the
      status"; that is now what arrives.

      The request stays here inverted: it still fails, but the failure is now
      diagnosable. A gap that closes leaves behind the test that proves it
      stayed closed.
    request:
      protocol: websocket
      url: "{{ws}}/ws/reject"
      websocket:
        steps:
          - action: expect
            timeout_ms: 3000
            message:
              $.error: { exists: true }

  - name: "a peer that never pongs is detected — and the request still fails"
    description: |
      AFFIRMATIVE, kept here because there is no other way to express it.

      /ws/no-pong reads pings and answers nothing while holding the socket
      open, which is the failure a heartbeat exists to detect and which cannot
      be simulated by closing the connection. curlew detects it correctly:

        step 2 (expect): websocket heartbeat timeout after 200ms

      That is the right answer. It is also a failed request, and curlew has no
      way to say "this request is expected to fail" — so the only place this
      can live is a file whose harness asserts failure.
    request:
      protocol: websocket
      url: "{{ws}}/ws/no-pong?hold_ms=3000"
      websocket:
        heartbeat:
          enabled: true
          interval_ms: 200
        steps:
          - action: expect
            timeout_ms: 2000
            message:
              $.type: { equals: "alive" }
          - action: expect
            timeout_ms: 2000
            message:
              $.type: { equals: "never arrives" }

  - name: "max_duration_ms can now fail on a slow body"
    description: |
      expected-failure: this assertion is wrong on purpose, and the point is
      that it is now CAPABLE of being wrong.

      This was §11C.6, and it lived in testapi/harness/timing.sh because no
      assertion could express it: internal/httpexec measured time.Since(start)
      around Do(), which returns when the HEADERS arrive, so the body read was
      never counted. Against /sse?events=5&ms=200 — one second of body, no
      headers to speak of — curlew reported

        duration_ms reported : 0
        timing.total_us      : 1010867

      from the same request.end event, and `max_duration_ms: 50` PASSED. A
      documented assertion that could not fail is worse than a missing one, and
      a defect that makes a wrong thing pass leaves no failing request to
      record — hence the harness.

      Duration is now measured after io.ReadAll, so this request takes ~1000ms
      and a 50ms ceiling is refused. That is why this entry belongs here rather
      than in a passing collection: the proof is that the assertion FAILS.
      If it ever passes again, gaps.sh reports an unexpected pass and the
      regression is visible.
    request:
      method: GET
      url: "{{mud}}/sse?events=5&ms=200"
    assertions:
      status: 200
      timing:
        max_duration_ms: 50

  - name: "a structural operator on a text body still fails"
    description: |
      expected-failure: this assertion is wrong on purpose, and it marks the
      boundary of the §11C.7 fix.

      A body that is not JSON is now assertable at `$` with the text
      operators — contains, matches, equals, length — and `response.body` in
      CEL is the raw string. The passing side of that lives in
      92-streaming.yaml.

      What must NOT happen is a structural operator quietly starting to pass
      against text. `type: array` against an event stream is a question about
      a document that does not exist, and it still reports that the body is
      not JSON. Without this entry, "assert on text bodies" could drift into
      "every operator succeeds somehow", which is the failure mode a
      permissive fallback invites.
    request:
      method: GET
      url: "{{mud}}/sse?events=2&ms=0"
    assertions:
      status: 200
      body:
        $: { type: "array" }

  - name: "TLS is unreachable, and the failure is at least legible"
    description: |
      AFFIRMATIVE AND GAP IN ONE REQUEST.

      The affirmative: curlew's TLS failure path is correct. The message names
      the cause exactly —

        Get "https://…/protocol": tls: failed to verify certificate:
        x509: certificate signed by unknown authority

      — and the run exits 4, which CLI_SPECIFICATION §17 assigns to "execution
      error: network failure, connection refused, TLS error". Nothing had ever
      checked that against a real TLS server.

      The gap: this is the ONLY answer curlew can get from any TLS posture.
      §11.3 records that there is no --insecure, no CA option, no client
      certificate support and no minimum version. §14.3 proposed SSL_CERT_FILE
      as the way around that; it was measured on go1.25.5 darwin/arm64 and does
      not work — not with SSL_CERT_DIR either, and not with
      GODEBUG=x509usefallbackroots=1. The same run with explicit RootCAs
      succeeds, so the certificates are sound and the trust mechanism is not.

      Chain building fails before expiry, hostname or intermediate are ever
      considered, so an expired leaf, a self-signed leaf and a wrong-hostname
      leaf would all produce this same string. That is why the other eight
      postures of §9.N are not built: eight endpoints a client cannot tell
      apart are what §16 deletes.

      curl reaches the same listener with --cacert and reports HTTP/2 over
      TLS 1.3, so the listener is real and the limit is on this side.
    request:
      method: GET
      url: "{{tls}}/protocol"
    assertions:
      status: 200
      body:
        $.tls.version: { matches: "^TLS 1\\." }
