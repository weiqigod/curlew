# A collection that ABORTS THE WHOLE RUN. No request result survives it.
#
# It lives in its own file, and needs its own harness category, because it
# destroys the very output the other gap checks read. gaps.sh parses
# `--format json` and inspects each request's `passed` field; here that array
# comes back EMPTY while the summary claims six requests passed, so an
# unmodified check would report "nothing evaluated" and blame itself.
#
# testapi/harness/gaps.sh treats every *.run-abort.yaml file as "must abort the
# run", and asserts the defect precisely: a non-zero exit, zero request results,
# and a summary that disagrees with that emptiness. When the defect is fixed all
# three stop being true and the harness fails, which is what forces this file to
# be promoted into testapi/collections/.
name: "EXPECTED RUN ABORT: a GraphQL response that is not JSON"
description: |
  gap: a non-JSON body on a graphql request aborts the entire collection.

  /graphql/http-error answers 500 with an HTML error page — a gateway that
  never reached the GraphQL service, which is the ordinary real-world case.
  §9.K predicted the shape of this: "a client that assumes every response
  parses as {data, errors} falls over."

  Three things go wrong at once:

    1. The run ABORTS. internal/runner returns an error rather than failing the
       one request, so every result in the collection is discarded — including
       the ones that already passed. `--format json` reports
       `"requests": []` beside `"summary": {"total": 8, "passed": 6}`: the
       summary and the request list contradict each other.

    2. The EXIT CODE IS 5. docs/CLI_SPECIFICATION.md §17 assigns 5 to
       "variable resolution error: undefined variable, circular reference, bad
       interpolation". A response body that is not JSON is none of those. CI
       reading that code triages a product problem as a pipeline
       misconfiguration. Exit 1 is the honest answer.

    3. The MESSAGE IS DOUBLED — "parsing graphql response: parsing graphql
       response: invalid character '<'". internal/graphql/graphql.go already
       names the operation, and internal/runner names it again on the way out.

  Note what is NOT the complaint: failing this request is entirely reasonable.
  You asked for GraphQL and got HTML. The complaint is that the failure takes
  seven unrelated requests, the results file, and the exit code with it.

  The assertions below are what a developer would want to write and cannot:
  neither runs, because the request never reaches assertion evaluation.

requests:
  - name: a passing request, to prove the abort takes it with it
    request:
      method: GET
      url: "{{mud}}/echo"
    assertions:
      status: 200

  - name: a 500 whose body is HTML, not a GraphQL document
    request:
      protocol: graphql
      url: "{{mud}}/graphql/http-error"
      graphql:
        query: "query ListUsers { users { id } }"
        error_handling: ignore
    assertions:
      status: 500
      headers:
        Content-Type: { matches: "text/html" }
