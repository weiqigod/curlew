name: M19-004 CEL assertions smoke
variables:
  base_url: "http://127.0.0.1:9180"
requests:
  - name: cel-passes
    request:
      method: GET
      url: "{{base_url}}/cel_response.json"
    assertions:
      cel:
        - "response.body.items.size() == 2"
  - name: cel-fails
    request:
      method: GET
      url: "{{base_url}}/cel_response.json"
    assertions:
      cel:
        - "response.body.total == double(response.body.items.size())"
