openapi: 3.0.3
info:
  title: Petstore Full
  version: 1.0.0
servers:
  - url: https://api.example.com/v1
components:
  schemas:
    Pet:
      type: object
      properties:
        name:
          type: string
        tag:
          type: string
    NewPet:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        tag:
          type: string
paths:
  /pets:
    get:
      operationId: listPets
      parameters:
        - name: X-API-Key
          in: header
          required: true
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer }
      responses:
        '200':
          description: A list of pets
        '404':
          description: Not found
    post:
      operationId: createPet
      parameters:
        - name: X-API-Key
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewPet'
      responses:
        '201':
          description: Created
        '404':
          description: Not found
  /pets/{petId}:
    get:
      operationId: showPetById
      parameters:
        - name: petId
          in: path
          required: true
          schema: { type: string }
        - name: X-API-Key
          in: header
          required: true
          schema: { type: string }
      responses:
        '200':
          description: A single pet
        '404':
          description: Not found
