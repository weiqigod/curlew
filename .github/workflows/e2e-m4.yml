name: E2E M4 full-pipeline

on:
  # Auto-triggers disabled while GitHub Actions billing is paused.
  # Re-enable by restoring the push/pull_request blocks once billing is resolved.
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E full pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      BACKEND_URL: http://localhost:5000
      WEB_BASE_URL: http://localhost:3000
      CURLEW_BACKEND_URL: http://localhost:5000

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build CLI
        run: go build -o curlew ./cmd/curlew

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Install Playwright browsers
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Start test stack
        run: ./scripts/test-stack.sh up

      - name: Mint backend token for CLI uploads
        id: mint-token
        run: |
          # Use the same fixed UUID that seed-test-data.sh uses for the owner.
          TOKEN=$(./scripts/test-token.sh owner@example.com 00000000-0000-0000-0000-000000000001)
          echo "CURLEW_BACKEND_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Run Go unit tests
        run: go test ./...

      - name: Run backend tests
        run: dotnet test src/ApiTool.Backend.Tests/ApiTool.Backend.Tests.csproj

      - name: Run web unit tests
        working-directory: web
        run: npm run test:unit

      - name: Run full-pipeline E2E spec
        working-directory: web
        run: npx playwright test tests/e2e/full-pipeline.spec.ts

      - name: Tear down test stack
        if: always()
        run: ./scripts/test-stack.sh down

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
