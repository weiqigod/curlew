name: M18 Compliance E2E

on:
  # Auto-triggers disabled while GitHub Actions billing is paused.
  # Re-enable by restoring the push/pull_request blocks once billing is resolved.
  workflow_dispatch:

concurrency:
  group: m18-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  m18-e2e:
    name: M18 compliance convergence E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      BACKEND_URL: http://localhost:5000
      WEB_BASE_URL: http://localhost:3000
      CURLEW_BACKEND_URL: http://localhost:5000

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Run Go unit tests
        run: go test ./...

      - name: Run backend tests
        run: dotnet test src/ApiTool.Backend.Tests/ApiTool.Backend.Tests.csproj

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Run web unit tests
        working-directory: web
        run: npm run test:unit

      - name: Install Playwright browsers
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Start test stack
        run: ./scripts/test-stack.sh up

      - name: Seed enterprise tier
        run: ./scripts/seed-enterprise.sh acme m18-auditor "audit_log.view,audit_log.export"

      - name: Run M18 compliance E2E scenario
        working-directory: web
        run: npx playwright test tests/e2e/m18-compliance.spec.ts

      - name: Tear down test stack
        if: always()
        run: ./scripts/ci-local.sh --down

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m18-playwright-report
          path: web/playwright-report/
          retention-days: 7
