name: Go CLI

on:
  # Auto-triggers disabled while GitHub Actions billing is paused.
  # Re-enable by restoring the push/pull_request blocks once billing is resolved.
  #
  # push:
  #   branches: [main]
  # pull_request:
  workflow_dispatch:

concurrency:
  group: go-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Go gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Installed with `go install` rather than golangci/golangci-lint-action:
      # ci-local.sh resolves the linter from ~/go/bin before PATH, which is
      # exactly where this lands, and the action's job is to run the linter —
      # the script already does that. The version is pinned to the one the
      # local gate uses so a new lint rule cannot fail a branch on a day
      # nobody changed any Go.
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.11.2

      # ci-local.sh's release step (M25-001) requires goreleaser and fails
      # without it rather than skipping -- so the workflow that delegates to that
      # script has to supply it. Pinned for the same reason golangci-lint is:
      # a new goreleaser release must not fail a branch on a day nobody touched
      # .goreleaser.yaml.
      #
      # `go install` here despite the same Go-version gap that makes release.yml
      # avoid it below: goreleaser v2.17.1's go.mod declares go 1.26.5, and
      # go-version-file: go.mod above resolves to 1.24.0. It works because
      # GOTOOLCHAIN is `auto` -- the default, not overridden anywhere in this
      # repo -- so this one `go install` transparently downloads the newer
      # toolchain it needs. Measured on a dev host at go1.25.5: it fetched
      # go1.26.6 and exited 0. release.yml declines to pay that download on
      # release day and installs a prebuilt goreleaser binary instead.
      - name: Install goreleaser
        run: go install github.com/goreleaser/goreleaser/v2@v2.17.1

      # The gate is scripts/ci-local.sh, not a copy of it. Restating the steps
      # here is how a workflow and the local gate drift until "CI is green"
      # and "ci-local passed" stop meaning the same thing — so this job shells
      # out to the same script a developer runs, and the two cannot disagree.
      #
      # --go skips the docker test stack; the .NET, web and Playwright gates
      # have their own workflows (e2e-*.yml).
      - name: Run the Go gate
        run: ./scripts/ci-local.sh --go

      - name: Upload coverage profile
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.out
          retention-days: 7
