name: Release

on:
  # Auto-triggers disabled while GitHub Actions billing is paused, matching
  # every other workflow in this directory. To cut releases automatically once
  # billing is resolved, restore:
  #
  #   push:
  #     tags:
  #       - 'v*'
  #
  # Until then a release is cut by dispatching this workflow against a tag, or
  # locally with `goreleaser release --clean`.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0). Must already exist."
        required: true

permissions:
  contents: write

jobs:
  goreleaser:
    name: Build and publish binaries
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          # goreleaser derives the version and changelog from tag history, so
          # a shallow clone would silently produce wrong release notes.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      # The gate at the next step now runs the release build (M25-001) and fails
      # hard when goreleaser is absent -- by design. Install it first, with the
      # same `~> v2` constraint the publish step below uses, so the gate and the
      # release cannot run different goreleasers.
      #
      # Deliberately install-only rather than `go install`: this workflow pins
      # go-version: '1.24' above, and goreleaser v2.17.1 declares go >= 1.26.5,
      # so `go install` would trigger a toolchain download on every release run.
      # The action installs a prebuilt binary instead, so no Go toolchain change
      # is needed just to run the gate.
      - name: Install goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          install-only: true

      # The gate runs before anything is published. A release is the one build
      # that must not be the first place a failure is noticed.
      - name: Go gate
        run: ./scripts/ci-local.sh --go

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
