version: "2"

# cmd/curlew/release_artifacts_test.go sits behind //go:build release_artifacts
# so it is excluded from the three routine `go test` passes in
# scripts/ci-local.sh (it drives a 28s six-target goreleaser release; see
# M25-002 D1). Without this, golangci-lint would build with default tags and
# skip that file entirely — an unlinted file in a repo whose gate claims to
# lint everything.
run:
  build-tags:
    - release_artifacts
    # cmd/curlew/readme_install_exec_test.go sits behind //go:build
    # readme_install for the same reason (M25-003 D1): it executes the
    # README's install commands, which costs several seconds and needs
    # network, gh and git credentials. Listed here so the file is linted
    # rather than silently skipped. Note both tags are set at once, so
    # symbols must be unique across the two tagged files.
    - readme_install

linters:
  enable:
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - unused

  # Keep vendored/third-party Go out of lint: web/ and site/ may contain
  # node_modules with Go files (e.g. flatted ships a Go port).
  exclusions:
    paths:
      - web/
      - node_modules/

formatters:
  enable:
    - gofumpt

  settings:
    gofumpt:
      extra-rules: true

  exclusions:
    paths:
      - web/
      - node_modules/
