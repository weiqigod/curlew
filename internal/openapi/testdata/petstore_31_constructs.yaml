# A 3.1 document that actually uses 3.1.
#
# testdata/petstore_31.yaml declares 3.1.0 and then uses nothing the version
# added, so it imported cleanly and proved nothing. Every construct below is
# either new in 3.1 or changed by its alignment with JSON Schema 2020-12, and
# each one was refused by a validator applying 3.0 rules (§11C.9).
openapi: 3.1.0
jsonSchemaDialect: https://spec.openapis.org/oas/3.1/dialect/base
info:
  title: Petstore 3.1 constructs
  summary: A one-line summary, added in 3.1
  version: 1.0.0
  license:
    name: MIT
    identifier: MIT
servers:
  - url: https://api.example.com/v1
webhooks:
  petStatusChanged:
    post:
      operationId: petStatusChanged
      responses:
        '200':
          description: Acknowledged
paths:
  /pets:
    get:
      operationId: listPets
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pet'
    post:
      operationId: createPet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pet'
      responses:
        '201':
          description: Created
components:
  schemas:
    Pet:
      type: object
      properties:
        id:
          type: string
        # The headline JSON Schema 2020-12 change: type as an array, with null
        # replacing 3.0's `nullable: true`.
        nickname:
          type: ["string", "null"]
        tags:
          type: ["array", "null"]
          items:
            type: string
