# Example collection that inherits output format from the project-level curlew.yaml.
# With curlew.yaml declaring output.format: json, running this collection with
# no CLI flags will produce JSON output on stdout.
#
# Run: curlew run examples/output-block/collection.yaml | jq -r '.summary.total'
name: Output Block Demo
requests:
  - name: hello
    request:
      method: GET
      url: "https://httpbin.org/get"
    assertions:
      status: 200
