  if_conditional:
    description: "Conditional request execution via `if:` field (M19) — closes REVIEW.md gap #24 (Rung 1 of docs/SCRIPTING.md's ladder). New `if:` field on request items accepts a single CEL boolean expression (no string truthiness, no Go-template interpolation — one syntax across `if:` and CEL assertions). Standard activation: `previous`, `vars`, `env` (no `response` — the current request hasn't run). Falsy expressions mark the request `skipped` (not counted in assertion totals, no retry increment); dependents via `depends_on:` propagate as skip-on-skipped-parent. The `if:` gate runs BEFORE templating so skipped items never trigger templating side effects (`from_command:`, vault fetches, faker seeding). `curlew validate` runs CEL parse + boolean type-check at validate time. Six output formatters render `skipped`. Universally available — no tier gate."
