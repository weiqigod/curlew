behaviors:
  - "Given docs/security/vendor-inventory.md is read, when its rows are inspected, then every external dependency (Stripe, SendGrid, Google Cloud KMS, AWS S3/SES, GitHub Apps, GitLab) is listed with columns: Vendor | Service | Data shared | Retention | Breach notification SLA | Vendor SOC 2 status | DPA on file"
  - "Given docs/security/data-flow-customer.md is read, when its diagrams are inspected (Mermaid embedded), then every customer-PII path is captured: CLI → backend (license, telemetry); web portal → backend (registration, dashboard, account/data); backend → SendGrid (transactional email); backend → Stripe (billing)"
  - "Given docs/security/data-flow-internal.md is read, when its diagrams are inspected, then every internal-secrets path is captured: backend ↔ KMS (signing keys + DEK wrapping per M18-009); team-vault coordinates encryption-at-rest; schedules.env_vars encryption-at-rest; refresh-token storage (DB hash + CLI keychain/file)"
  - "Given the first pen-test engagement is scheduled (Q2 2026 per v4-15 cadence), when the artefact docs/security/pentest-2026-Q2.md is read, then it carries Scope, Methodology, Findings (by severity), Remediation log (with PR references), Sign-off"
  - "Given the pen-test artefact references remediated items, when each is traced, then a corresponding git commit or PR link exists in the Remediation log column"
  - "Given the vendor inventory references each external dependency, when an auditor follows the DPA on file column, then a link or footnote points to the storage location of the executed DPA (S3 bucket path, contract management tool URL, or 'on file at legal@')"
  - "Given the two DFDs reference internal architecture, when read against the live codebase, then every named component maps to an actual directory or service (CLI = cmd/curlew/, backend = src/ApiTool.Backend/, web = web/, KMS = Google Cloud KMS or FileKeyProvider per deployment)"
  - "Given the pen-test cadence is annual per v4-15, when docs/COMPLIANCE.md is read, then it names the next pen-test target window (Q2 2027) and the budget-line owner"

scope: |
