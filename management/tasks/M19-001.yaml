id: M19-001
title: "if: field on request items (CEL boolean gate)"
status: done
priority: 1
created: 2026-05-16
phase: "M19: Strategic expressiveness"

dependencies:
  - M19-002

observable: |
  go build ./cmd/apitest && \
    ./apitest run smoke/fixtures/if_conditional.yaml --output terminal && \
    go test ./internal/runner/... -run TestIfConditional -count=1
  Expected: terminal output shows three requests where the second renders as
  "SKIPPED  confirm-pending-order  (if: false)" and the third (depends_on the
  skipped one) also renders "SKIPPED  (parent skipped)". Exit code 0. The
  go-test invocation reports PASS for at least TestIfConditional_FalseSkips,
  TestIfConditional_TrueRuns, TestIfConditional_SkipsBeforeTemplating,
  TestIfConditional_SkipPropagatesToDependents, and
  TestIfConditional_NonBoolRejectedByValidate (>= 5 subtests PASS).

behaviors:
  - "Given a request item with `if: \"previous.body.status == 'pending'\"` and a previous response whose body.status is 'pending', when the runner reaches the item, then the request is sent and its result appears in the output with status `ok` or `fail` per its assertions."
  - "Given a request item with `if: \"previous.body.status == 'pending'\"` and a previous response whose body.status is 'cancelled', when the runner reaches the item, then the request is not sent, the run records status `skipped` for that item, and no assertion totals are incremented for it."
  - "Given a skipped request item, when a downstream request declares `depends_on:` that skipped item, then the downstream item also records status `skipped` with reason `parent skipped` and is not executed."
  - "Given a request item with an `if:` expression that references `vars.x` where `x` is registered in the sensitive variable set, when CEL evaluation resolves the reference, then the resolved value is added to the run's `SensitiveSet` via `internal/variable/sensitive.go` before any output formatter serialises it."
  - "Given a request whose body uses `{{from_command: ...}}` interpolation and whose `if:` evaluates to false, when the runner processes the item, then the templating step is not invoked and no sub-shell, vault fetch, or faker seed call is observed (verified by a recording fake in the test)."
  - "Given a collection file with `if: \"1 + 1\"` (CEL type `int`, not `bool`), when `apitest validate` runs against it, then it exits non-zero with error code `ERR_CEL_TYPE`, the field path `if`, and a message naming `bool` as the required type."
  - "Given a collection file with `if: \"previous.body.status ==\"` (CEL parse error), when `apitest validate` runs, then it exits non-zero with `ERR_CEL_PARSE`, the field path `if`, and a truncated source excerpt of at most 200 chars."
  - "Given a run with mixed `skipped`, `ok`, and `fail` results, when each of the six output formatters in `internal/output/` (terminal, JSON, TAP, JUnit, HTML, Markdown) renders the run, then `skipped` appears as a distinct status in each formatter's output and is excluded from assertion-total counters."

scope: |
  Add `If string` to the request-item struct in `internal/parser/` and accept
  it as a YAML scalar that is parsed (but not yet evaluated) at load time.
  Wire a pre-templating gate in `internal/runner/runner.go`: before the
  per-request templating step, the runner calls the CEL evaluator from
  M19-002's `internal/cel/` package with the `if:` activation surface
  (`previous`, `vars`, `env`) and a registered sensitive-variable observer
  that funnels resolved-sensitive values into `internal/variable/sensitive.go`
  via `SensitiveSet.AddValue`. A falsy result short-circuits the request and
  emits an internal `skipped` status; templating is never invoked for skipped
  items. Implement skip-on-skipped-parent: the dependency-edge walker treats
  a parent marked `skipped` as a skip-propagation source, so downstream items
  with `depends_on:` referencing the skipped item also mark `skipped` with
  reason `parent skipped`. Update all six formatters under `internal/output/`
  (terminal.go, json.go, tap.go, junit.go, html.go, markdown.go) to render the
  `skipped` status and to exclude skipped items from assertion totals and
  retry counters. Wire the validate command (in `internal/validator/` plus
  its invocation from `cmd/apitest/main.go`) to call CEL parse + boolean
  type-check on every `if:` site, surfacing `ERR_CEL_PARSE` and `ERR_CEL_TYPE`
  with the field path and 200-char-truncated source. Add a smoke fixture at
  `smoke/fixtures/if_conditional.yaml` exercising true, false, and
  skip-on-skipped-parent. NOT in scope: CEL in `assertions:` (M19-004),
  CEL in `extract:` (dropped from M19), MANUAL.md updates (M19-005), skill
  expansion (M19-006), any SPECIFICATION.md edit.

definition_of_done:
  - "All behavior tests pass"
  - "Test coverage >= 80% for the new code paths in internal/parser/, internal/runner/, internal/output/, and the validate plumbing"
  - "No build warnings or lint errors"
  - "./scripts/ci-local.sh --go passes"
  - "Six output formatters render `skipped` and the existing formatter golden tests are updated to include a skipped-status case"
  - "Validate error catalogue includes `ERR_CEL_PARSE` and `ERR_CEL_TYPE` entries with the field path and 200-char source-truncation rule"
  - "Smoke fixture `smoke/fixtures/if_conditional.yaml` runs as part of `./smoke/run.sh` and the script asserts the SKIPPED lines for the false branch and its dependent"
  - "Help text for `apitest validate` and `apitest run` lists `if:` as a request-item field (where help is feature-listed)"

complexity: high
estimated_effort: "large slice"
track: go-cli
