id: M4-007
title: "CLI: pr-check subcommand posting status to backend"
status: done
priority: 2
created: 2026-04-14
phase: "M4: Team Tier"
dependencies:
  - M4-004
observable: |
  go build ./cmd/curlew
  # Start a local mock of the backend results endpoint
  ./testdata/team/mock-backend.sh &
  MOCK_PID=$!
  CURLEW_BACKEND_URL=http://localhost:18080 \
  CURLEW_BACKEND_TOKEN=dev-token \
    ./curlew pr-check \
      --org acme \
      --pr 42 \
      --repo acme/api \
      --results testdata/team/sample-junit.json
  # Expected stdout: "Uploaded result res_... (pass=3 fail=0); status check posted"
  # Exit 0. Mock log shows POST /api/v1/organizations/acme/results then
  # POST /api/v1/organizations/acme/pr-checks with pr=42.
  kill $MOCK_PID
  go test ./internal/prcheck/... ./cmd/curlew/... -run 'PrCheck' -count=1
  # Expected: ok, >=7 tests
behaviors:
  - "Given a valid results file and backend token, when curlew pr-check is run, then it POSTs the results payload and prints the returned result id"
  - "Given the results upload succeeds, when pr-check continues, then it POSTs a pr-check status payload (repo, pr, state=success|failure, result_id) to the backend"
  - "Given CURLEW_BACKEND_URL is missing, when pr-check runs, then it exits with code 2 and 'backend URL not configured' without sending any HTTP traffic"
  - "Given the results file has at least one failing test, when pr-check uploads it, then the status posted is failure and the CLI exit code is 1"
  - "Given the backend returns 401, when pr-check runs, then the CLI prints 'unauthorized: refresh CURLEW_BACKEND_TOKEN' and exits 2"
  - "Given --dry-run is passed, when pr-check runs, then no HTTP traffic is sent and stdout shows the JSON that would have been posted"
  - "Given curlew pr-check --help is invoked, then it documents --org, --pr, --repo, --results, --dry-run, and the CURLEW_BACKEND_* environment variables"
  - "Given the backend is unreachable (connection refused), when pr-check runs, then the CLI retries twice with 200ms backoff and then exits 2 with a networking error"
scope: |
  New subcommand in cmd/curlew/prcheck.go and supporting package
  internal/prcheck that builds multipart-free JSON payloads and posts to
  {base}/api/v1/organizations/{org}/results followed by
  {base}/api/v1/organizations/{org}/pr-checks. The mock backend script
  testdata/team/mock-backend.sh is a tiny Go-based stub that records calls.
  No dependency on a real GitHub app — the CLI only talks to our backend;
  the backend-side GitHub integration is out of scope for this slice.
definition_of_done:
  - "go test ./internal/prcheck/... passes with >=7 tests"
  - "Real binary invocation against the mock produces the expected stdout and exit code"
  - "Help text documents every flag and env var"
  - "testdata/team/sample-junit.json and mock-backend.sh checked in"
  - "smoke/run.sh invokes pr-check --dry-run against a fixture"
  - "Error paths (401, connection refused, missing env) asserted on"
complexity: medium
estimated_effort: "5-8 hours"
track: go-cli
