id: M8-003
title: "output: block in project + collection YAML with CLI>collection>project precedence"
status: done
priority: 1
created: 2026-04-24
phase: "M8: Developer & Agent Exploration Experience"
dependencies: [M8-002]
observable: |
  # Schemas accept output: at both project and collection levels.
  go test -run TestSchema_accepts_output ./internal/schema/...
  # Expected: PASS — project-level, collection-level, each format,
  # each verbosity, unknown-format rejection, empty-path rejection.

  # New project schema exists at the stable versioned path.
  ls schemas/project-v1.json
  # Expected: -rw-r--r--  schemas/project-v1.json

  # `curlew schema --project` emits the project schema.
  ./curlew schema --project | jq -r .title
  # Expected: "Curlew Project v1"
  ./curlew schema --project | jq -r '.["$id"]'
  # Expected: https://raw.githubusercontent.com/peterlindqvist/curlew/main/schemas/project-v1.json

  # `curlew schema` (no flag) still emits the collection schema.
  ./curlew schema | jq -r .title
  # Expected: "Curlew Collection v1"

  # Precedence: CLI flag > collection output > project output > built-in.
  go test -run TestOutputPrecedence ./cmd/curlew/...
  # Expected: PASS — four sub-tests (builtin-default, project-wins,
  # collection-wins, cli-wins).

  # End-to-end: project-level output.format=json with no CLI flag produces
  # valid JSON on stdout.
  ./curlew run examples/output-block/collection.yaml | jq -r '.summary.total'
  # Expected: a number; stdout is valid JSON under the project default.

  # Unknown format in YAML fails before any request runs.
  ./curlew run examples/output-block/bad-format.yaml
  # Expected: exit 3, stderr contains 'unknown output format "markdown"'
  # and lists the supported formats.

  # `curlew init` scaffolds an active output: block in curlew.yaml.
  cd "$(mktemp -d)" && /path/to/curlew init --project-name demo \
    && grep -A3 '^output:' curlew.yaml
  # Expected: format: terminal / verbosity: normal block present.

  # Manual: with redhat.vscode-yaml installed and both yaml.schemas entries
  # from MANUAL.md §1.5 applied locally, editing curlew.yaml offers
  # autocomplete for output.format and flags unknown formats inline.
behaviors:
  - "schemas/project-v1.json exists at repo root as a Draft 2020-12 schema with $id https://raw.githubusercontent.com/peterlindqvist/curlew/main/schemas/project-v1.json, title 'Curlew Project v1', and additionalProperties: false at top level."
  - "Both schemas/project-v1.json and schemas/collection-v1.json accept an optional top-level output: object with keys format, report, events, verbosity (additionalProperties: false, all optional)."
  - "output.format enum is exactly [terminal, json, tap, junit, html]; markdown is intentionally excluded until W4 ships."
  - "output.verbosity enum is [quiet, normal, verbose, debug] and maps to output.VerbosityQuiet, VerbosityDefault, VerbosityVerbose, VerbosityDebug."
  - "parser.Collection.Output and config.ProjectConfig.Output are typed *output.Config fields populated from the parsed YAML; both round-trip through unmarshal."
  - "Runtime precedence is resolved once in runCmdInner before the formatter or events emitter is constructed: CLI flag > collection.output > project.output > built-in default."
  - "runFlags records explicit-set status for format, report, events, and verbosity (parallel bools) so the zero value of --format terminal is distinguishable from 'flag not passed'."
  - "Unknown output.format or empty output.report / output.events path fails validation at schema-compile time with exit code 3 and a structured stderr message; watch and run both honor this before any HTTP request."
  - "schema.ProjectSchema is a byte-slice alias (var ProjectSchema = schemas.ProjectV1), mirroring schema.CollectionSchema."
  - "curlew schema --project emits the project schema on stdout; curlew schema (no flag) continues to emit the collection schema (backward-compatible)."
  - "scaffold.Init emits an active minimal output: block (format: terminal, verbosity: normal) in curlew.yaml, and the scaffolded file validates against schemas/project-v1.json."
  - "docs/MANUAL.md §1.5 documents a second yaml.schemas entry mapping schemas/project-v1.json to **/curlew.yaml; CHANGELOG.md [Unreleased] -> Added has an M8-003 bullet."
scope: |
  Add a typed output: block accepted at both curlew.yaml (project default)
  and collection YAML (override), with CLI > collection > project > built-in
  precedence resolved once in cmd/curlew/main.go before formatter and
  events-emitter construction. Publish schemas/project-v1.json at the repo
  root so both levels are editor-validated; mirror the M8-001 pattern
  (schemas/ owns the //go:embed, internal/schema aliases as schema.ProjectSchema,
  MANUAL.md §1.5 documents the second yaml.schemas entry, drift-guard and
  reachability tests mirror the collection schema's). Extend scaffold.Init to
  emit an active minimal output: block. Extend curlew schema with a --project
  flag. Duplicate the $defs.output subschema across the two schema files with
  a drift-guard test to keep them byte-identical — cross-file $ref is solvable
  but not worth the resolver ceremony for a 20-line block.

  Implementation is TDD-paired per behavior. Parametric TestSchema_accepts_output
  drives fixtures under internal/schema/testdata/ (project output, collection
  output, each format, each verbosity, negatives). TestOutputPrecedence in
  cmd/curlew/ drives the four precedence cases with in-process runCmdInner
  calls over io.Writer buffers. OutputConfig lives in internal/output/ alongside
  Verbosity; parser.Collection and config.ProjectConfig both import it.
  runFlags gains formatSet/reportSet/eventsSet/verbositySet parallel bools —
  less invasive than converting the struct fields to pointers.

  Not in scope. Per-request output overrides (IMPROVEMENT.md §5 W2 Risks
  explicitly rejects in v1). Markdown format (W4 adds the formatter and
  extends the enum; M8-003 enum stays at five values). Duplicate-request-name
  detection (IMPROVEMENT.md §8.2 flags this as a W4 prerequisite, not W2 scope).
  Threading output: through the exec subcommand (different subcommand model;
  exec --log lives on its own path). Environment-aware init scaffolding
  (CI=true → format: tap). schemastore.org publication of project schema
  (deferred per W1 precedent until a tagged release).
