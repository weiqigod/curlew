id: M19-004
title: "assertions: - cel: <expression> shape"
status: done
priority: 1
created: 2026-05-16
phase: "M19: Strategic expressiveness"

dependencies:
  - M19-002

observable: |
  go build ./cmd/apitest && \
    ./apitest run smoke/fixtures/cel_assertions.yaml --output terminal && \
    go test ./internal/assertion/... -run TestCelAssertion -count=1
  Expected: terminal output shows the run with one passing CEL assertion
  ("body.total == sum of items") and one failing CEL assertion whose failure
  message includes the expression source and the resolved sub-values for each
  named reference (for example: `response.body.total = 9.50`,
  `response.body.items.map(i, i.price).sum() = 10.50`). Exit code 1 because
  one assertion fails. go test reports PASS for at least
  TestCelAssertion_TruePasses, TestCelAssertion_FalseFails,
  TestCelAssertion_FailureMessageIncludesResolvedSubvalues,
  TestCelAssertion_MutualExclusionWithOperatorAssertion,
  TestCelAssertion_SensitiveValueRedactedInFailureMessage (>= 5 subtests PASS).

behaviors:
  - "Given an assertion entry `- cel: \"response.body.total == response.body.items.map(i, i.price).sum()\"` and a response where the equality holds, when the runner evaluates assertions, then the assertion is recorded as `pass` and counted in the assertion totals."
  - "Given the same CEL assertion and a response where the equality does not hold, when the runner evaluates assertions, then the assertion is recorded as `fail`, the failure message contains the literal expression source, and it also contains the resolved value for each top-level named reference in the expression (`response.body.total`, `response.body.items.map(...)`)."
  - "Given an assertion entry that contains both `cel:` and an operator key (e.g. `eq:`) on the same entry, when the parser loads the file, then parsing fails with a clear error stating that `cel:` and operator assertions are mutually exclusive per entry."
  - "Given an assertion with `cel:` whose expression references `vars.api_key` and `api_key` is in the sensitive variable set, when the assertion fails and the failure message is built, then the resolved value of `api_key` is replaced with the standard redaction marker (`***`) and does not appear in the rendered output of any formatter."
  - "Given an assertion with `cel:` that compiles to a non-bool type (e.g. `cel: \"1 + 1\"`), when `apitest run` reaches the assertion, then evaluation fails with an `ERR_CEL_TYPE` runtime error attributed to `assertions[N].cel` and the run reports the assertion as `fail` (not crash)."
  - "Given a request that is skipped by `if:` (M19-001), when its `assertions:` would otherwise run, then no `cel:` assertion is evaluated and none is counted in the run's assertion totals."
  - "Given a CEL assertion in the activation `{response, previous, vars, env}`, when the expression references `request` (the in-flight request body), then compilation fails with `ERR_CEL_PARSE` naming `request` as an undeclared identifier."

scope: |
  Extend the assertion struct in `internal/parser/` (and any parser type in
  `internal/assertion/`) to accept the new entry shape `- cel: "<expression>"`.
  Enforce mutual exclusion: an entry with `cel:` set may not also set any
  operator key. Wire the CEL evaluator from `internal/cel/` into the
  assertion-evaluation path in `internal/assertion/` (and the call site in
  `internal/runner/runner.go`) with the full `assertions:` activation:
  `response`, `previous`, `vars`, `env`. On `pass`, increment the existing
  pass counter; on `fail`, build a failure message that includes the literal
  expression source and the resolved value of each top-level named reference
  in the expression (walk the parsed CEL AST to enumerate references). Pass
  the sensitive-observer hook into the evaluator so values from sensitive
  vars are recorded in the run's `SensitiveSet`; the existing output
  redaction layer (`internal/variable/sensitive.go` + formatter redaction)
  then masks them. Runtime CEL type errors during evaluation are caught and
  surface as a normal assertion failure with `ERR_CEL_TYPE` framing. Add a
  smoke fixture `smoke/fixtures/cel_assertions.yaml` exercising a passing
  and a failing CEL assertion. NOT in scope: `if:` field (M19-001),
  validate-time type-check pass over CEL assertions (M19-005 — M19-004 only
  wires runtime evaluation), MANUAL.md or skill updates (M19-005 / M19-006).

definition_of_done:
  - "All behavior tests pass"
  - "Test coverage >= 80% for the new code paths in internal/parser/ and internal/assertion/"
  - "No build warnings or lint errors"
  - "./scripts/ci-local.sh --go passes"
  - "Failure-message renderer for `cel:` assertions enumerates each top-level named reference and its resolved value; covered by golden tests in internal/output/"
  - "Mutual-exclusion parser error has an entry in the existing parse-error catalogue"
  - "Smoke fixture `smoke/fixtures/cel_assertions.yaml` runs as part of `./smoke/run.sh` and the script asserts the failure message contains the expression source"

complexity: high
estimated_effort: "large slice"
track: go-cli
