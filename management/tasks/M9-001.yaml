  go test -run 'TestSchema_v10|TestSchema_v11' ./internal/output/events/...
  # Expected: PASS (unchanged).

  # Integration: request_slug surfaces in emitted NDJSON for a real run.
  go test -run 'TestRunner_RequestSlugAllEmitSites' ./internal/runner/...
  # Expected: PASS; slug present on RequestStart + RequestEnd across
  # sequential, parallel, data-driven, and websocket emit paths.

  # Full unit + integration suite.
  go test -run 'TestSlug_Derive|TestEvents_v12_RequestSlug|TestSchema_v12_validates|TestRunner_RequestSlugAllEmitSites' ./...
