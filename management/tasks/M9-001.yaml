  ./curlew run collections/sample.yaml --events run.ndjson
  jq -c 'select(.kind=="request.start") | {name, request_id, request_slug}' run.ndjson
  # Expected: each line has a request_slug derived from name, e.g.,
  #   {"name":"Get user","request_id":"req-1","request_slug":"get-user"}

  # Slug derivation handles unicode, punctuation, case, and edges.
  go test -run 'TestSlug_Derive' ./internal/parser/...
  # Expected: PASS; covers "Get user" -> "get-user", "Create Post!" ->
  # "create-post", "Héllo 世界" -> "hello", empty/whitespace-only rejected.

  # v1.2 schema is published alongside v1.1 (retained historical anchor).
  ls docs/events-schema/v1.2.json docs/events-schema/v1.1.json docs/events-schema/v1.0.json
