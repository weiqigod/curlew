behaviors:
  - "A slug helper in internal/parser/ (new file slug.go) converts a request name to a URL-safe slug: Unicode NFKD normalized, lowercased, non-alphanumeric runs collapsed to a single hyphen, leading/trailing hyphens trimmed."
  - "The slug helper returns a non-nil structured error for names that slugify to empty (whitespace-only or punctuation-only); callers surface this as a load-time error, matching the early-reject posture of the duplicate-name check at parser/parser.go:106-146."
  - "Every RequestStart and RequestEnd event carries the derived slug: the request_id generator at runner.go:321-323 pairs id assignment with slug derivation, and the slug is threaded to all emit sites (sequential main emission, parallel wave emission, data-driven iteration emission, WebSocket emission) so no path emits an event without the field."
  - "RequestStartEvent and RequestEndEvent gain a new exported field RequestSlug string with tag `json:\"request_slug,omitempty\"` in internal/output/events/events.go; omitempty preserves forward-compat with consumers that do not expect the field."
  - "docs/events-schema/v1.2.json is published as a new versioned schema; docs/events-schema/v1.1.json and v1.0.json remain byte-unchanged as historical anchors, matching the M8-004 pattern for v1.0 retention."
  - "docs/EVENTS_SCHEMA_v1.2.md documents the additive request_slug field, the slug derivation rule, and confirms backward-compatibility with v1.1 consumers."
  - "Events emitted in this version report schema_version \"1.2\"; v1.1 goldens are not edited and continue to report \"1.1\"."
  - "A concrete consumer anchors the schema: one integration test reads request_slug from the NDJSON stream for a real fixture collection and asserts it matches the expected derivation for each request name."
  - "Duplicate-name rejection (shipped in M8-004 at parser.go:106-146) already guarantees that distinct main-phase requests yield distinct slugs; no second-chance collision logic is required."
scope: |
  Pure plumbing slice; no user-visible markdown format yet. The goal is
  to land the correlation primitive used by W4's sentinel tags and by
  W5's future skill narration.

  1. Slug derivation helper. New file internal/parser/slug.go exposing
     Slug(name string) (string, error). Algorithm: Unicode NFKD
     normalize -> lowercase -> replace runs of non-[a-z0-9] with single
     hyphen -> trim leading/trailing hyphens. Empty result returns a
     structured error. Unit-tested against a table of names including
     ASCII, punctuation, Unicode combining marks, digits, whitespace.

  2. Events schema extension. Add RequestSlug field with tag
     `json:"request_slug,omitempty"` to RequestStartEvent and
     RequestEndEvent in internal/output/events/events.go. Bump the
     SchemaVersion constant to "1.2" at emission sites; v1.1 goldens
     are unchanged.

  3. Runner wiring. The request_id generator at runner.go:321-323
     derives the slug once per RequestItem and caches it on the
     per-request context; every RequestStart/RequestEnd emit site
     (including parallel executor, data-driven iterator, WebSocket
     adapter) passes slug alongside request_id.

  4. Schema publication. docs/events-schema/v1.2.json is authored as
     an additive superset of v1.1.json. docs/EVENTS_SCHEMA_v1.2.md
     narrates the delta and backward-compatibility guarantees.

  5. Tests. TestSlug_Derive is table-driven. TestSchema_v12_validates
     loads v1.2.json and validates representative goldens.
     TestEvents_v12_RequestSlug asserts emission on every code path.
     TestRunner_RequestSlugAllEmitSites covers sequential, parallel,
     data-driven, and websocket paths end-to-end.

  Not in scope.
  - Markdown formatter: "markdown" stays absent from SupportedFormats
    (config.go:15) until M9-002.
  - CHANGELOG entry: M9-005 batches all W4 CHANGELOG + IMPROVEMENT.md
    edits.
  - IMPROVEMENT.md §6/§8.1 corrections about the v1.1-vs-v1.2 claim:
    deferred to M9-005 with the W4 status flip.
  - Slug rendering in setup/teardown markdown: W4 only covers main-
    phase requests. Setup/teardown emit events with slug for
    consistency, but no .md files are written for them.
