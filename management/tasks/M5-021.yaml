  - "dotnet test ApiTool.Backend.sln passes (565/565, no regression)"
  - "go test ./... passes"
  - "golangci-lint run passes (0 issues)"
  - "./smoke/run.sh passes"
  - "CI job 'E2E M5 enterprise-full' is green on the fix branch (link captured in verify report)"
complexity: low
estimated_effort: "1-2 hours"
