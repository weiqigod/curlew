behaviors:
  - "Given docs/EVENTS_SCHEMA_v0.1.md exists, when read, then it documents: schema_version contract, every event kind with field semantics, ordering guarantees (ids monotonic, at_ms may skew under parallel), body truncation defaults, run.error vs run.end, and the v0.x → v1.0 promotion criteria."
  - "Given docs/events-schema/v0.1.json exists, when a test regenerates the schema from the Go struct definitions in internal/output/events, then the generated schema diffs empty against the checked-in file."
  - "Given the examples embedded in docs/EVENTS_SCHEMA_v0.1.md, when extracted and parsed, then every one validates against docs/events-schema/v0.1.json."
  - "Given an agent reading the schema alone (no source code), when it looks up a code (e.g. PARSE_INVALID_YAML), then the doc points it to the error category, the producing package, and the expected hint structure."
  - "Given the stability policy section, when read, then it states: v0.x allows additive changes, rename/removal requires major bump; v1.0 promotion requires the validation harness (M6-007) to pass against all canonical broken fixtures."
scope: |
  New docs/EVENTS_SCHEMA_v0.1.md — single file, structured by event kind.
  Covers semantics that agents need to write reliable consumers.

  New docs/events-schema/v0.1.json — JSON Schema draft-07 covering every
  event struct. Generated by a code generator under internal/output/events/
  or hand-written with a diffing test.

  Test additions:
    - TestSchema_DocInSyncWithCode: regenerates JSON Schema from Go structs
      and asserts diff-empty against the checked-in file.
    - TestSchema_MarkdownExamplesValidate: extracts fenced ```json and
      ```ndjson blocks from the doc and validates each.

  No runtime changes; this slice is pure documentation + sync test.
