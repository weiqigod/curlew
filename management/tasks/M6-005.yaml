  - "End-to-end CLI test under cmd/apitest drives a real ./apitest binary with --events against a fixture collection and asserts the stream shape"
  - "golangci-lint run passes with 0 issues"
  - "Test coverage does not regress below 80%"
  - "Smoke test passes; smoke also exercises --events on the happy path"
  - "./scripts/ci-local.sh passes"
complexity: high
estimated_effort: "2-3 days"
