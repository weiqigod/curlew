id: M5-001
title: "Backend: SAML 2.0 SSO auth flow"
status: done
priority: 2
created: 2026-04-18
phase: "M5: Enterprise Tier"
track: backend
dependencies:
  - M4-003
observable: |
  dotnet test src/ApiTool.Backend.Tests/ApiTool.Backend.Tests.csproj \
    --filter "FullyQualifiedName~Sso&FullyQualifiedName~Saml"
  # Expected: Passed: >=10, Failed: 0
  dotnet run --project src/ApiTool.Backend &
  sleep 2
  TOKEN=$(./scripts/test-token.sh owner@example.com)
  ORG=$(curl -sS -H "Authorization: Bearer $TOKEN" \
    http://localhost:5000/api/v1/organizations | jq -r '.organizations[0].id')
  curl -sS -X PUT -H "Authorization: Bearer $TOKEN" \
    -H "Content-Type: application/json" \
    --data-binary @testdata/backend/sso/saml-config.json \
    "http://localhost:5000/api/v1/organizations/$ORG/sso/saml"
  # Expected HTTP 200, body contains "sso_enabled":true,"sso_provider":"saml"
  curl -sSL -D - "http://localhost:5000/api/v1/sso/saml/$ORG/login" | head -20
  # Expected HTTP 302 with Location header to IdP SSO URL and SAMLRequest query param
behaviors:
  - "Given an org owner with a valid bearer token, when PUT /organizations/{id}/sso/saml is called with idp_metadata_url, acs_url, and entity_id, then the response is 200 and organization.settings.sso_enabled=true with sso_provider=saml is persisted"
  - "Given a malformed SAML config missing idp_metadata_url, when PUT /organizations/{id}/sso/saml is called, then the response is 400 with code invalid_sso_config and a pointer to the missing field"
  - "Given an org with sso_provider=saml configured, when GET /api/v1/sso/saml/{org_id}/login is called, then the response is 302 with a Location header to the IdP that contains a signed SAMLRequest query parameter"
  - "Given a signed SAMLResponse posted to /api/v1/sso/saml/{org_id}/acs with a valid IdP-signed assertion, when the email matches an org member, then the response is 302 to the web portal with an ApiTool session cookie set"
  - "Given a SAMLResponse with an invalid signature, when POST /sso/saml/{org_id}/acs is called, then the response is 401 with code saml_signature_invalid and no session is created"
  - "Given a SAMLResponse whose email does not match any org member, when POST /sso/saml/{org_id}/acs is called, then the response is 403 with code sso_user_not_member"
  - "Given a non-owner user, when PUT /organizations/{id}/sso/saml is called, then the response is 403 permission_denied"
  - "Given the service is running, when curl hits /swagger/v1/swagger.json, then the JSON lists PUT /organizations/{id}/sso/saml, GET /sso/saml/{org_id}/login, and POST /sso/saml/{org_id}/acs with their schemas"
scope: |
  Extend src/ApiTool.Backend with a new Sso/ folder containing SamlController,
  SamlOptions, and a pluggable ISamlHandler backed by Sustainsys.Saml2 (or
  equivalent). Define a typed SsoConfig C# record to match the spec's SSOConfig
  interface. EF migration 0006_sso_config adds no new table (reuses the JSONB
  settings column on organizations), but stores IdP certificates in a new
  sso_credentials table (org_id, kid, public_cert_pem, created_at). Fixtures
  testdata/backend/sso/saml-config.json and a self-signed test IdP key live
  under src/ApiTool.Backend.Tests/Sso/TestData.
definition_of_done:
  - "All behavior tests pass"
  - "Observable output works as specified"
  - "Test coverage >= 80%"
  - "No build warnings or lint errors"
  - "Swagger lists the three new SAML endpoints"
  - "Smoke test or equivalent integration check updated (if new capability)"
complexity: high
estimated_effort: "8-12 hours"
