  - "go.mod and go.sum updated with github.com/google/cel-go pinned to a tagged release, and `go mod tidy` leaves no diff"
  - "Public package documentation (doc.go or package-level godoc) explains the standard activation, the disabled time-of-day functions, and the sensitive-observer contract"
  - "Error sentinels `ErrCelParse` and `ErrCelType` are exported and reachable via `errors.Is`"

