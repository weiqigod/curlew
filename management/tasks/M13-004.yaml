observable: |
  go build ./cmd/curlew

  go test -run 'TestRegistry_FakerCompany' -v ./internal/variable/...
  # Expected: PASS — all 5 company functions registered.
  # $faker.company returns a non-empty string;
  # $faker.companySuffix returns one of {Inc., LLC, Corp., Ltd., Co.};
  # $faker.jobTitle, $faker.department, $faker.catchPhrase return non-empty strings.

  go test -run 'TestRegistry_FakerCompany_Seeded' -v ./internal/variable/...
  # Expected: PASS — given --seed=42, two consecutive runs produce byte-equal output.

  go test -run 'TestRegistry_FakerCompany_Unseeded' -v ./internal/variable/...
  # Expected: PASS — without --seed, two consecutive runs differ.

  TMP=$(mktemp -d); cd "$TMP"; curlew init demo && cd demo
  # Body: {"employer":"{{$faker.company}}","title":"{{$faker.jobTitle}}","dept":"{{$faker.department}}"}
  curlew run collections/sample.yaml --dry-run --format json
  # Expected: employer/title/dept are realistic non-empty strings.

  go test ./...
  # Expected: PASS.
behaviors:
  - "Given the registry, when `$faker.company` is evaluated, then the result is a non-empty company name from the shipped pool (e.g. `Acme Corporation`; per SPECIFICATION.md:795)."
  - "Given the registry, when `$faker.companySuffix` is evaluated, then the result is one of {`Inc.`, `LLC`, `Corp.`, `Ltd.`, `Co.`} (per SPECIFICATION.md:796)."
  - "Given the registry, when `$faker.jobTitle` is evaluated, then the result is a non-empty job title from the shipped pool (per SPECIFICATION.md:797)."
  - "Given the registry, when `$faker.department` is evaluated, then the result is a non-empty department name from the shipped pool (per SPECIFICATION.md:798)."
  - "Given the registry, when `$faker.catchPhrase` is evaluated, then the result is a non-empty multi-word business phrase, generated by composing one entry each from three small word pools (adjective, noun, gerund) joined by a single space (per SPECIFICATION.md:799)."
  - "Given `--seed 42`, when any of the 5 company functions are evaluated twice across two independent runs, then both outputs are byte-equal."
  - "Given no `--seed`, when any of the 5 company functions are evaluated twice across two independent runs, then both outputs differ."
  - "Given `--locale de-DE` is passed on the CLI, when any company function is evaluated, then the en-US data set is still used; locale support is deferred (see M13 Open Decision #1)."
scope: |
  Add 5 registrations to internal/variable/dynamic.go for the company-data
  family in SPECIFICATION.md:791–799: `$faker.company`, `$faker.companySuffix`,
  `$faker.jobTitle`, `$faker.department`, `$faker.catchPhrase`. Ship small
  package-scope pools: a list of company names, a fixed list of suffixes
  ({Inc., LLC, Corp., Ltd., Co.}), a list of job titles, a list of
  departments, and three pools (adjective / noun / gerund) for catchPhrase.

  Locale: en-US only. Per M13 Open Decision #1, the `--locale` flag is
  recognised-but-warns-and-ignores. Spec citation: SPECIFICATION.md:859–904
  (deferred).

  Files touched:
  - internal/variable/dynamic.go (5 new noArgs registrations + 5 new
    package-level pools)
  - internal/variable/dynamic_test.go (new TestRegistry_FakerCompany*
    tests including seeded-reproducibility and no-seed-entropy)
  - docs/MANUAL.md §3.7 (5 new rows in the dynamic-functions table)

  Not in scope: locale support; industry-specific company-name realism
  beyond the small shipped pool. Spec citations: SPECIFICATION.md:791–799.
definition_of_done:
