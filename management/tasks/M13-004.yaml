  - "go test ./... passes"
  - "go test -cover ./internal/variable/... >= 80%"
  - "golangci-lint run passes with 0 issues"
  - "./smoke/run.sh passes"
  - "./scripts/ci-local.sh passes"
  - "docs/MANUAL.md §3.7 dynamic-functions table includes 5 new rows for the company-data family with example values matching SPECIFICATION.md:793–799"
  - "Seeded-reproducibility and no-seed-entropy tests both pass"
complexity: low
estimated_effort: "2-3 hours"
