id: M2-001
title: "from_command variable source"
status: done
priority: 1
created: 2026-03-20
phase: "M2: Vault Commands"

dependencies:
  - M1-009
  - M1-014
  - M1-028

observable: |
  Create a collection with `from_command: "echo secret123"` variable.
  Run `apitest run tests.yaml` (at Solo tier) and confirm the variable resolves to "secret123".
  Run at Free tier and confirm exit code 6 with feature gate message.
  Run `go test ./internal/variable/...` to verify from_command behavior.

behaviors:
  - "Given a variable with `from_command: 'echo hello'`, when the collection is executed at Solo tier, then the variable resolves to the command stdout ('hello')"
  - "Given a variable with `from_command` and `sensitive: true`, when executed, then the value is redacted in all output"
  - "Given a variable with `from_command` and `cache: 300`, when the same variable is needed within 300 seconds, then the cached value is used without re-executing the command"
  - "Given a variable with `from_command` at Free tier, when the collection is parsed, then exit code 6 and a feature gate error message is returned"
  - "Given a `from_command` that fails (non-zero exit), when the collection is executed, then a clear error message shows the command, exit code, and stderr"
  - "Given a `from_command` with pipe syntax (`cmd1 | cmd2`), when executed, then the pipeline is executed via shell and stdout captured"
  - "Given `from_command` variables at precedence level 5, when CLI --var overrides exist, then CLI values take precedence"

scope: |
  Extend `internal/variable/` to support `from_command` variable sources with shell execution,
  stdout capture, exit code handling, and caching with configurable TTL. Extend
  `internal/parser/collection.go` to parse the object-form variable syntax with `from_command`,
  `sensitive`, and `cache` fields. Register `from_command` as a Solo-tier feature gate in
  `internal/auth/registry.go`. Integrate into `internal/runner/` variable resolution pipeline
  at precedence level 5.

definition_of_done:
  - All behavior tests pass
  - Observable output works as specified
  - Test coverage >= 80%
  - No build warnings or lint errors
  - Help text updated (if user-facing)
  - Smoke test updated (if new capability)

complexity: high
estimated_effort: "6-10 hours"
