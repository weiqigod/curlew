id: M16-014
title: "Outbound IGitLabCheckPoster and pr_checks provider discriminator"
status: done
priority: 3
created: 2026-05-07
phase: "M16: Workflow completion"

dependencies:
  - M16-013

track: backend

observable: |
  Apply the migration with `dotnet ef database update` and confirm `psql -c "\d pr_checks"` shows `provider TEXT NOT NULL DEFAULT 'github' CHECK (provider IN ('github','gitlab'))`, plus nullable `gitlab_installation_id UUID` and `gitlab_status_id BIGINT` columns. Roll back cleanly. Start the backend pointing at a stub GitLab server (`GITLAB__BASE_URL_OVERRIDE=http://localhost:9099`), seed a `gitlab_installations` row with a test PAT, and POST a check via `curl -X POST -H "Authorization: Bearer <team_jwt>" -H "Content-Type: application/json" -d '{"provider":"gitlab","commit_sha":"abc123","status":"success",...}' http://localhost:5000/api/v1/pr-checks`. Observe the stub server received `POST /api/v4/projects/<id>/statuses/abc123` with `Private-Token: <decrypted-pat>` and body containing `state=success, name=Curlew, description<=255 chars, target_url, context=ci/curlew`. Run `dotnet test src/ApiTool.Backend.Tests --filter "FullyQualifiedName~GitLabCheckPoster|PrCheckProvider"` — all pass.

behaviors:
  - "Given the migration is applied, when pr_checks is inspected, then provider TEXT NOT NULL with CHECK ('github','gitlab'), gitlab_installation_id UUID NULL FK to gitlab_installations(id), gitlab_status_id BIGINT NULL"
  - "Given an existing GitHub-side row, when the migration runs, then provider defaults to 'github' for back-compat and existing flows are unchanged"
  - "Given a successful POST with cli_state=success, when GitLabCheckPoster maps state, then it sends GitLab state='success' with name='Curlew', description trimmed to 255 chars, and target_url validated as HTTPS"
  - "Given cli_state=timed_out, when state-mapping runs, then GitLab state='failed' with description prefixed by '[timed out]' (lossy mapping per GL-4)"
  - "Given cli_state=neutral or skipped, when state-mapping runs, then GitLab state='success' with description prefixed by 'neutral: <reason>' or 'skipped: <reason>' (marker pattern per GL-4)"
  - "Given the GitLab API returns 401 (PAT revoked), when the poster handles the response, then gitlab_installations.access_token_revoked_at is set, a token-revoked notification is queued, and pr_checks.status = 'gitlab_token_revoked'"
  - "Given the GitLab API returns RateLimit-Remaining=0 with RateLimit-Reset, when the poster handles the response, then it backs off until the reset time per the existing token-bucket pattern"
  - "Given two POSTs with the same (commit_sha, name, context), when GitLab is queried, then idempotency is preserved (POST is idempotent on GitLab side; we rely on it for retry safety per the spec)"
  - "Given gitlab_base_url is HTTP without GITLAB__ALLOW_HTTP=true in production, when the poster constructs the request, then the HTTP request is rejected with a clear configuration error (per Open Decision 2)"

scope: |
  EF Core migration adding `provider` discriminator + nullable `gitlab_installation_id` (FK) + `gitlab_status_id` to `pr_checks`. New `src/ApiTool.Backend/GitLab/Outbound/IGitLabCheckPoster.cs` and `GitLabCheckPoster` implementation wrapping `HttpClient` against `{gitlab_base_url}/api/v4/projects/{project_id}/statuses/{commit_sha}` with `Private-Token` auth (decrypted at request time via `IGitLabKeyProvider`). Implement the state mapping table from spec lines 9233-9242 (timed_out → failed, neutral/skipped → success+marker). Per-installation token-bucket honouring `RateLimit-*` headers. URL validation: HTTPS required unless `GITLAB__ALLOW_HTTP=true` (per Open Decision 2). Description truncated to 255 chars with `…(truncated)` suffix. Wire into the existing `PrChecksUploadEndpoint` so the dispatcher routes to GitLab poster when `provider=gitlab`. Update `PrCheck` entity with the new columns; preserve all existing GitHub paths.

