  - "Help text updated for new flags/subcommands (--refresh-vault on curlew run and curlew worker)"
  - "Smoke test updated if user-visible (scripts/smoke.sh exercises the team-vault fetch)"

complexity: high
estimated_effort: "6-12 hours"
