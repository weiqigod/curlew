behaviors:
  - "Given the Phase 4 harness, when it runs against mudflat, then it exercises a surface no existing phase reaches."
  - "Given a defect it finds, when the defect is fixed, then the reproduction is moved into a passing collection, an inverted expected-failure, or a unit test -- never deleted."
