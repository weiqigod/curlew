scope: |
  Phases 1, 2 and 3 are implemented and have found sixteen defects, all fixed.
  The specification's phases are now exhausted. Two harnesses retired
  themselves by their own promotion instructions, one was inverted from
  "these must be rejected" to "these must import", and
  redaction-known-leaks.txt is empty. That is the intended end state of a
  campaign, and it means further dogfooding requires design rather than
  execution.

  Design Phase 4 around what the first three could not reach. Candidate
  surfaces, to be narrowed during planning rather than all built:

    - Stateful sequences: a collection whose correctness depends on ordering
      across phases, retries and extracted state, where a wrong answer is a
      wrong value rather than an error. Every defect found so far announced
      itself with an error or a crash; the retention defect did not, and it
      was the worst one.
    - Long-running and streaming: slow responses, chunked bodies, servers that
      stop mid-body, WebSocket sessions outliving a phase boundary.
    - Adversarial-but-legal servers: valid HTTP that is hostile in shape --
      enormous headers, deep JSON nesting, duplicate keys, contradictory
      Content-Type, redirect chains, mismatched Content-Length.
    - Concurrency under contention: --parallel against endpoints with real
      shared state, where a race produces a plausible wrong answer rather than
      a failure.

  The unifying criterion, and the one worth holding to: prefer surfaces where a
  defect produces a *wrong result* over surfaces where it produces an *error*.
  Errors are found by any test. Wrong results are what shipped software gets
  wrong, and store_results: summary reporting "3 passed, 0 failed" with exit 0
  is the local proof of that.

  Follow the existing discipline exactly: specify the phase in
  docs/TESTAPI_SPECIFICATION.md before building it, wire it into ci-local.sh as
  a gate step, and move every reproduction rather than deleting it.

  Out of scope: TLS matrix expansion. Section 14.3 already records the
  measurement showing there is no client-side route to trusting mudflat's CA on
  this toolchain, and that finding stands.

definition_of_done:
  - Phase 4 specified in docs/TESTAPI_SPECIFICATION.md before implementation
  - Harness implemented in testapi/ and wired into ci-local.sh as a failing gate step
  - Every defect found is fixed and its reproduction moved, never deleted
  - Findings recorded in a new section alongside 11A/11B/11C
  - "`./scripts/ci-local.sh` passes"
  - CHANGELOG.md updated

complexity: high
