id: M5-012
title: "go-cli: perf metrics and HTML/JSON report"
status: done
priority: 3
created: 2026-04-18
phase: "M5: Enterprise Tier"
track: go-cli
dependencies:
  - M5-011
observable: |
  go build ./cmd/curlew
  go test ./internal/loadgen/report/...
  # Expected: ok  internal/loadgen/report  (>=6 tests passing)
  ./curlew perf testdata/perf/sample-request.yaml \
    --vus 5 --duration 3s --output perf-report.json
  # Expected stdout (tail):
  #   "Results: requests=N, p50=Xms, p95=Yms, p99=Zms, error_rate=0%"
  #   "Wrote perf-report.json"
  ./curlew perf testdata/perf/sample-request.yaml \
    --vus 5 --duration 3s --output perf-report.html
  # Expected: perf-report.html created; file contains <title>curlew perf report</title>
behaviors:
  - "Given a completed perf run, when metrics are emitted, then the summary line includes requests, p50, p95, p99 latencies (ms), throughput (req/s), and error_rate (%)"
  - "Given --output report.json, when the run completes, then a JSON file is written containing a metrics object with percentiles, counts, and a time-series of requests/sec and latency per second"
  - "Given --output report.html, when the run completes, then an HTML file is written containing an embedded Chart.js line chart of latency vs time and a metrics table"
  - "Given --output stdout (default), when the run completes, then the summary is printed to stdout and no file is created"
  - "Given --output report.xyz (unsupported extension), when the run completes, then the CLI prints 'error: unsupported report format .xyz' and exits with code 2"
  - "Given percentiles are computed, when the sample set has fewer than 100 data points, then p99 falls back to max and a warning 'p99 may be imprecise for small samples' is appended to the summary"
  - "Given --help is passed, when the binary runs, then the help text documents --output with supported extensions json/html/stdout"
  - "Given a perf run with --output report.json, when a second run writes to the same path, then the file is overwritten (no append)"
scope: |
  New internal/loadgen/report subpackage that consumes the metrics stream
  from M5-011 and emits JSON or HTML. HTML template embeds Chart.js via a
  CDN script tag (offline users can pass --offline to embed a bundled copy;
  deferred to a future slice). Percentiles computed via a streaming quantile
  digest (github.com/influxdata/tdigest) or a simple sort for small datasets.
definition_of_done:
  - "All behavior tests pass"
  - "Observable output works as specified"
  - "Test coverage >= 80%"
  - "No build warnings or lint errors"
  - "Help text documents --output, --format and example invocations"
  - "Smoke test exercises curlew perf --output report.json and asserts file contents"
complexity: medium
estimated_effort: "4-6 hours"
