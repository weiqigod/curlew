  - "Given apitest validate with --format json, then validation results are output as JSON"
  - "Given apitest validate on multiple files (glob pattern), when executed, then all files are validated"
scope: |
  Add `validate` command to CLI. Reuse parsing logic without execution. Add
  structural validation checks. Report all issues (not just first).
