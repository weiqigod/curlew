observable: |
  Run `./apitest validate collection.yaml` on valid and invalid files. Verify
  pass/fail output without HTTP requests.
behaviors:
  - "Given a valid collection file, when apitest validate runs, then exit code 0 and valid message"
  - "Given invalid YAML syntax, when validated, then exit code 3 with parse error and line number"
  - "Given missing required fields, when validated, then exit code 3 listing missing fields"
