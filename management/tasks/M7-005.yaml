id: M7-005
title: "Thread stdout and stderr writers through runCmdInner (remove os.Stdout swap)"
status: done
priority: 1
created: 2026-04-22
phase: "M7: Output Discipline"
track: go-cli
observable: |
  # captureJSONCollection no longer hijacks os.Stdout at the process level.
  grep -rn "os.Stdout = " cmd/apitest/
  # Expected: zero matches.

  # runCmdInner takes explicit writer parameters.
  grep -n "^func runCmdInner" cmd/apitest/main.go
  # Expected: func runCmdInner(args []string, stdout, stderr io.Writer) (int, *runner.Summary)

  # Concurrent glob discovery works without stream corruption.
  go test -run TestConcurrentDiscovery ./cmd/apitest/...
  # Expected: PASS — two glob-matched collections run in parallel
  # goroutines with separate writer buffers and produce non-interleaved
  # JSON documents.

  # Static-analysis gate rejects future reassignment of os.Stdout.
  go test -run TestNoOsStdoutAssignment ./cmd/apitest/...
  # Expected: PASS.
behaviors:
  - "Given runCmdInner is called with a bytes.Buffer as stdout and another as stderr, when it completes, then all JSON/TAP/JUnit/HTML output targeted at os.Stdout now lands in the provided stdout buffer."
  - "Given runCmdInner is called with per-collection writer buffers from two goroutines concurrently, when both complete, then each goroutine's JSON output lands only in its own buffer — no interleaving, no cross-contamination."
  - "Given captureJSONCollection in discovery_run.go, when invoked, then it calls runCmdInner with a bytes.Buffer directly and does NOT assign to os.Stdout."
  - "Given watchCmd, when it invokes runCmdInner via RunFunc, then it passes watch.Config.Stdout / Stderr as the writers — not os.Stdout / os.Stderr globals."
  - "Given the binary invoked through the CLI entry point runCmd, when runCmdInner is called, then os.Stdout and os.Stderr are passed as the writers — preserving backward-compatible CLI behavior."
  - "Given the existing test suite, when migrated to the new signature, then tests inject writers directly instead of replacing os.Stdout or reading from a captured pipe."
  - "Given TestNoOsStdoutAssignment using go/ast, when it scans cmd/apitest/*.go, then no source file contains an assignment whose left-hand side is os.Stdout or os.Stderr."
scope: |
  Architectural refactor. The root cause of captureJSONCollection's
  os.Stdout hijack (discovery_run.go:303-326) is that runCmdInner
  accepts no writer parameters — callers cannot inject where output
  goes, so they rewrite the process-global file descriptor. Fix:
  thread writers through the function boundary.

  Signature change (cmd/apitest/main.go:428):
    func runCmdInner(args []string) (int, *runner.Summary)
  becomes
    func runCmdInner(args []string, stdout, stderr io.Writer) (int, *runner.Summary)

  Inside runCmdInner, replace every bare os.Stdout / os.Stderr
  reference with the passed writers. Recon count: 20+ sites,
  concentrated in the format branches (main.go:618-705 parse-error
  branch; :779-988 empty-collection branch; :1223-1339 tap/junit/html
  dispatch; :1264-1306 junit with --report; :1308-1339 html with
  --report) and the terminal rendering loop (:1350-1411 via the 'out'
  and 'errOut' printers).

  Callers to update:
    - runCmd (main.go:1513) — pass os.Stdout, os.Stderr.
    - watchCmd RunFunc (main.go:1558) — pass watch.Config.Stdout and
      watch.Config.Stderr through the RunFunc closure signature (extend
      RunFunc to accept writers, or use a closure that captures them).
    - runDiscoveredCollections (discovery_run.go:159) — thread writers
      through; per-collection branches use per-collection buffers for
      --format json capture.
    - captureJSONCollection (discovery_run.go:303) — DELETE the
      os.Stdout = w block entirely; pass w directly to runCmdInner as
      the stdout argument. Function simplifies from ~25 lines to ~10.

  Tests to migrate:
    - cmd/apitest/main_test.go, run_test.go, discovery_run_test.go:
      any test that replaces os.Stdout or reads from a captured pipe
      now injects a bytes.Buffer directly. Net result: simpler,
      goroutine-safe, faster tests.

  New tests:
    - TestConcurrentDiscovery — launches two glob-matched runs in
      separate goroutines with separate stdout/stderr buffers; asserts
      each goroutine's output lands only in its own buffer and no
      interleaving occurs.
    - TestNoOsStdoutAssignment — parses every cmd/apitest/*.go with
      go/ast, walks ast.AssignStmt nodes, fails if any LHS selector
      is os.Stdout or os.Stderr (anti-regression gate).

  Prior art to mirror: cmd/apitest/discovery_run.go:126
  writeGateForFormat(stdout, stderr io.Writer, ...) and
  internal/worker/run.go worker.RunOptions{Stdout}.

  This task is orthogonal to M7-001/002/003/004 — ships independently.
  Unlocks (but does not implement) parallel runDiscoveredCollections
  as a future follow-up.
definition_of_done:
  - "All behavior tests pass"
  - "runCmdInner signature is (args []string, stdout, stderr io.Writer) (int, *runner.Summary)"
  - "grep -rn 'os.Stdout = ' cmd/apitest/ returns zero matches"
  - "grep -rn 'os.Stderr = ' cmd/apitest/ returns zero matches"
  - "TestConcurrentDiscovery verifies no interleaving when two runs execute in parallel goroutines with separate writers"
  - "TestNoOsStdoutAssignment uses go/ast to reject any future reassignment of os.Stdout or os.Stderr in cmd/apitest/"
  - "All existing tests that hijacked os.Stdout are migrated to inject writers directly"
  - "captureJSONCollection function is simplified to direct buffer injection — no fd-swap"
  - "go test ./... passes with no regressions (existing format goldens are byte-identical)"
  - "Test coverage does not regress below 80%"
  - "golangci-lint run passes with 0 issues"
  - "./smoke/run.sh passes"
  - "./scripts/ci-local.sh passes"
  - "CHANGELOG.md updated"
complexity: high
estimated_effort: "1-2 days"
