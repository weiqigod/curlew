  - "JSONOutput.Summary present in every run (jq '.summary' returns object)"
  - "DataDrivenJSON.Iterations populated for data-driven runs"
  - "Existing JSON snapshot tests updated to expect the new shapes"
  - "go test ./... passes"
  - "go test -cover ./internal/output/... ./cmd/apitest/... >= 80%"
  - "golangci-lint run passes with 0 issues"
  - "./smoke/run.sh passes"
  - "./scripts/ci-local.sh passes"
  - "IMPROVEMENT.md §2.4 bullets 1 (JSON half) + 4 marked Shipped"
complexity: low
estimated_effort: "1 day"
