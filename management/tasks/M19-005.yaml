id: M19-005
title: "curlew validate CEL parse/type-check + MANUAL.md section"
status: done
priority: 1
created: 2026-05-16
phase: "M19: Strategic expressiveness"

dependencies:
  - M19-002
  - M19-001
  - M19-004

observable: |
  go build ./cmd/curlew && \
    ./curlew validate smoke/fixtures/cel_validate_bad.yaml; echo "exit=$?" && \
    ./curlew validate smoke/fixtures/cel_validate_good.yaml; echo "exit=$?" && \
    go test ./internal/validator/... -run TestValidateCel -count=1
  Expected: the bad fixture exits non-zero and prints two error lines,
  one with `ERR_CEL_PARSE` and field path `assertions[0].cel`, and one with
  `ERR_CEL_TYPE` and field path `if` naming `int` as the actual type. The
  good fixture exits 0 with no error output. go test reports PASS for at
  least TestValidateCel_ParseErrorReported, TestValidateCel_TypeErrorReported,
  TestValidateCel_WalksAllCelSites, TestValidateCel_TruncatesSourceTo200Chars,
  TestValidateCel_NoHttpRequestFiredDuringValidate. The MANUAL.md table of
  contents at `docs/MANUAL.md` contains a new entry "Expression Language (CEL)"
  (verifiable by `grep -c "Expression Language (CEL)" docs/MANUAL.md` returning
  at least 1).

behaviors:
  - "Given a collection file with one `if:` site and two `assertions: - cel:` sites, when `curlew validate` runs, then it invokes CEL parse + type-check on every site and reports any parse or type error with the precise field path (`if`, `requests[2].if`, `assertions[0].cel`, etc.)."
  - "Given an `if:` site whose CEL expression compiles to type `int`, when `curlew validate` runs, then it emits `ERR_CEL_TYPE` for that site and includes both the actual type (`int`) and the expected type (`bool`) in the message."
  - "Given an `assertions: - cel:` site with a syntactically invalid expression, when `curlew validate` runs, then it emits `ERR_CEL_PARSE` for that site with the field path and the 200-char-truncated source excerpt."
  - "Given a CEL site whose source is longer than 200 characters and triggers an error, when validate prints the error, then the printed source excerpt is exactly 200 characters with a trailing ellipsis marker."
  - "Given any collection file (with or without CEL sites), when `curlew validate` runs, then no HTTP request is sent (verified by running validate against a fixture whose URL points to an unreachable host; validate still exits 0 on a valid file)."
  - "Given the project documentation, when `docs/MANUAL.md` is rendered, then it contains a new section titled `Expression Language (CEL)` under `Variable System and Precedence` with: the standard activation reference (`response`, `previous`, `vars`, `env`), the `if:` field reference, the `assertions: - cel:` shape, a `when to use CEL vs operators` decision table, the list of disabled functions (`now`, zero-arg `timestamp`), and the error codes `ERR_CEL_PARSE` and `ERR_CEL_TYPE`."

scope: |
  Add a CEL-walk pass to `internal/validator/` that visits every `if:` site
  and every `assertions: - cel:` site in the parsed collection and calls
  `internal/cel/` Compile with the appropriate activation surface (`if:`
  expects `bool`; `assertions:` expects `bool`). Map cel-go errors to the
  existing validate error catalogue with two new codes `ERR_CEL_PARSE` and
  `ERR_CEL_TYPE`, populate the field path (`if`, `requests[i].if`,
  `requests[i].assertions[j].cel`), and truncate source excerpts to 200 chars
  with a trailing ellipsis. Wire the call from `cmd/curlew/main.go`'s
  validate subcommand. Add fixtures `smoke/fixtures/cel_validate_good.yaml`
  and `smoke/fixtures/cel_validate_bad.yaml` and extend `./smoke/run.sh` to
  cover both. Edit `docs/MANUAL.md`: add a new section `Expression Language
  (CEL)` under `Variable System and Precedence` containing the standard
  activation, both integration sites (`if:` and `assertions: - cel:`), the
  decision table (operator assertions for simple field comparisons; CEL for
  cross-field invariants, aggregations, and predicates spanning multiple
  paths), the disabled-function list, and the new error codes. NOT in scope:
  any edits to `templates/skills/claude/curlew/` — that surface is owned by
  M19-006; M19-005 deliberately does not touch the bundled skill to avoid
  double-edit collisions. NOT in scope: any edits to `docs/SPECIFICATION.md`
  — v4.4 spec edition is a follow-up commit, not blocking M19. NOT in
  scope: runtime CEL evaluation in `if:` or `assertions:` (already shipped
  in M19-001 and M19-004).

definition_of_done:
  - "All behavior tests pass"
  - "Test coverage >= 80% for the validate-CEL pass in internal/validator/"
  - "No build warnings or lint errors"
  - "./scripts/ci-local.sh passes (touches docs as well as Go)"
  - "Validate error catalogue documents `ERR_CEL_PARSE` and `ERR_CEL_TYPE` with field-path semantics and the 200-char source-truncation rule"
  - "docs/MANUAL.md contains a new `Expression Language (CEL)` section with the standard activation, both integration sites, the decision table, disabled-function list, and error codes"
  - "Smoke fixtures `cel_validate_good.yaml` and `cel_validate_bad.yaml` exercised by `./smoke/run.sh`"
  - "templates/skills/claude/curlew/ is untouched by this commit (collision guard with M19-006)"

complexity: medium
estimated_effort: "medium slice"
track: go-cli
