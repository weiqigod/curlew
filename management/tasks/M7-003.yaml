  - "usageSynopsis helper exists in main.go and is reused by every error-recovery site"
  - "Explicit --help invocations continue to write to stdout; error-recovery writes synopsis to stderr"
  - "go test ./... passes with no regressions"
  - "Test coverage does not regress below 80%"
  - "golangci-lint run passes with 0 issues"
  - "./smoke/run.sh passes"
  - "./scripts/ci-local.sh passes"
  - "CHANGELOG.md updated"
complexity: medium
estimated_effort: "3-5 hours"
