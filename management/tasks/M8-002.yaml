behaviors:
  - "The schema accepts requestItem.auth as a string referring to a named auth profile."
  - "The schema accepts retry blocks at collection, section, and request scopes (matching internal/retry.FullConfig)."
  - "The schema accepts data_driven at request scope (matching internal/datadriven.Config)."
  - "The schema accepts setup/teardown as either an array of requestItems or an object { retry, items }."
  - "The schema accepts variables values in the object form (from_command / value / sensitive / cache) in addition to the plain string map form."
  - "The schema constrains assertions.status to oneOf[integer, array[integer]]."
