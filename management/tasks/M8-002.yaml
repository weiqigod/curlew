  - "Every collection fixture under examples/ still validates (no regression)"
  - "CHANGELOG.md updated with M8-002 entry"
  - "go test -cover ./internal/schema/... ≥ 80%"
  - "./scripts/ci-local.sh passes"
complexity: medium
