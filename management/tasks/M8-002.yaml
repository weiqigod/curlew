scope: |
  Close the schema gaps identified in the W1 audit (IMPROVEMENT.md §5 Risks).
  One fixture YAML per gap under internal/schema/testdata/. One parametric
  sub-test per fixture in a new internal/schema/validate_coverage_test.go.

  Gap list:
    1. request.auth (string) — parser field: collection.go:51
    2. collection-level retry — parser field: collection.go:32 (*retry.FullConfig)
    3. section-level retry (setup/teardown object form) — parser field: collection.go:27
    4. request-level retry — parser field: collection.go:52
    5. data_driven (request scope) — parser field: collection.go:53 (*datadriven.Config)
    6. section object form for setup/teardown — parser Section struct
    7. variables object form (from_command/value/sensitive/cache) —
       parser's custom SensitiveVars.UnmarshalYAML
    8. assertions.status oneOf[integer, array[integer]] — current schema
       leaves status type-unconstrained.

  Implementation approach: one TDD pair per gap (RED fixture that fails
  validation, GREEN schema addition, assertion the fixture now validates).
  All additive changes — no breaking changes to the v1 schema; still
  schemas/collection-v1.json (additive schema changes are backward-
  compatible under JSON Schema semantics).
definition_of_done:
