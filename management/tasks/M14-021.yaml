  - "testdata/m14/e2e-collection.yaml and the Playwright spec checked in"
  - "docs/M14_INVESTIGATION.md updated with a 'verified end-to-end on <date>' marker (doc-only commit on completion)"
  - "CI workflow .github/workflows/m14-e2e.yml runs on PRs touching backend/cmd/apitest/web"
  - "MANUAL.md gains the apitest login + apitest run --report-upload walkthrough section"
