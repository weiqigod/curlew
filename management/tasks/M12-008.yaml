  # Expected: PASS — $randomPassword('16') returns a 16-char string
  # containing at least one upper, one lower, one digit, one symbol.

  go test -run 'TestRegistry_RandomPassword_Seeded' -v ./internal/variable/...
  # Expected: PASS — with a fixed --seed, the same length always
