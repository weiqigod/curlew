  - "Given a Solo, Professional, Team, or Enterprise license, when a collection with a `from_command` variable is run, then behavior is unchanged from before (still allowed)"
  - "Given internal/variable/command.go (the from_command execution path), when M15-003 lands, then no implementation changes are required because the variable system already supports from_command at any tier"
  - "Given docs/MANUAL.md, when scanned after M15-003 lands, then every `[Solo]` and 'Solo tier' reference attached to from_command is updated to reflect Free-tier availability (badge removed, table row updated, prose wording corrected)"
  - "Given the table-of-contents anchor for the from_command section, when updated, then the slugified link target stays consistent with the corresponding section heading"
  - "Given the registry_test.go tier-matrix tests, when run after the change, then they assert from_command is allowed at all five tiers (Free through Enterprise)"
  - "Given backwards compatibility, when an existing Solo+ collection that uses from_command runs after M15-003, then it continues to work unchanged"

