phase: "M15: Tier-matrix corrections"
track: go-cli

dependencies: []

observable: |
  go build -o ./apitest ./cmd/apitest
  go test ./internal/auth/... ./internal/variable/... -count=1
  # Expected: registry_test.go's tier matrix asserts from_command at TierFree.

  # Free-tier license runs a collection that uses a from_command variable:
  cat > /tmp/m15-003.yaml <<'EOF'
  name: m15-003-from-command
  variables:
    GREETING: { from_command: "echo hello" }
  requests:
    - name: echo-back
      request: { method: GET, url: "https://httpbin.org/get?msg={{GREETING}}" }
  EOF
  ./apitest --license ./testdata/m15/license-free.jwt run /tmp/m15-003.yaml
  echo "exit=$?"
  # Expected: request runs, status code printed, no gate error; exit 0.

  # Doc verification — no remaining `[Solo]` next to from_command in MANUAL.md:
  grep -n "from_command.*\[Solo\]\|from_command.*Solo tier\|| \`from_command\` | Solo" \
    docs/MANUAL.md
  # Expected: no matches.

behaviors:
