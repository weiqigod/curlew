behaviors:
  - "Given the registry, when `$faker.fileName` is evaluated, then the result matches `^[a-z0-9_-]+\\.[a-z0-9]+$` (a base name with a dotted extension; per SPECIFICATION.md:842) and the extension is one drawn from the same pool used by $faker.fileExtension."
  - "Given the registry, when `$faker.fileExtension` is evaluated, then the result is a 2 to 4 character lowercase string with no leading dot (e.g. `pdf`, `jpg`, `mp4`, `txt`; per SPECIFICATION.md:843)."
  - "Given the registry, when `$faker.mimeType` is evaluated, then the result matches `^[a-z]+/[a-z0-9.+-]+$` and is one of a shipped MIME-type pool (e.g. `application/pdf`, `image/jpeg`, `text/plain`; per SPECIFICATION.md:844)."
  - "Given the registry, when `$faker.imageUrl` is evaluated with no args, then the result is exactly `https://picsum.photos/640/480` (the default per SPECIFICATION.md:845)."
  - "Given the registry, when `$faker.imageUrl('800','600')` is evaluated, then (a) M12-001's parseDynArgs parses the two quoted args into args=['800','600'] without modification, (b) the registration body strconv.Atoi-converts each, validates positivity, and (c) the result is exactly `https://picsum.photos/800/600`."
  - "Given the registry, when `$faker.imageUrl('-100','480')` or `$faker.imageUrl('0','480')` is evaluated, then it returns a structured CategoryInput error naming the bad dimension (positive integers required)."
  - "Given the registry, when `$faker.imageUrl('abc','480')` is evaluated, then it returns a structured CategoryInput error matching the existing $randomBase64 / $randomPassword error shape."
  - "Given `--seed 42`, when any of the 4 file functions are evaluated twice across two independent runs, then both outputs are byte-equal."
  - "Given no `--seed`, when $faker.fileName, $faker.fileExtension, or $faker.mimeType are evaluated twice across two independent runs, then both outputs differ. ($faker.imageUrl with fixed default args is intentionally deterministic — its output is the constant default URL — and is excluded from the unseeded-entropy assertion.)"
  - "Given `--locale de-DE` is passed on the CLI, when any file function is evaluated, then the en-US data set is still used; locale support is deferred (see M13 Open Decision #1)."
scope: |
  Add 4 registrations to internal/variable/dynamic.go for the file-data
  family in SPECIFICATION.md:838–845: `$faker.fileName`,
  `$faker.fileExtension`, `$faker.mimeType`, `$faker.imageUrl`. Ship a
  small extension pool (pdf, jpg, png, mp4, txt, csv, json, ...) and a
  matching MIME-type pool. $faker.fileName composes a random base name
  plus a random extension drawn from the same extension pool.

  Argument-bearing: `$faker.imageUrl(width, height)`. Per M13 Open
  Decision #6, M12-001's parseDynArgs is reused without modification —
  args travel in as quoted strings and the registration body
  strconv.Atoi-converts them, validates positivity, and formats the
  picsum.photos URL. The no-arg form returns the constant default
  URL `https://picsum.photos/640/480` per SPECIFICATION.md:845.

  Locale: en-US only. Per M13 Open Decision #1, the `--locale` flag is
  recognised-but-warns-and-ignores. Spec citation: SPECIFICATION.md:859–904
  (deferred).

  Files touched:
  - internal/variable/dynamic.go (4 new registrations; $faker.imageUrl
    uses the manual DynFunc form to handle the 0-or-2 arity, mirroring
    $randomBase64 at internal/variable/dynamic.go:351; $faker.fileName
    and $faker.fileExtension share an extension+mime parallel pool)
  - internal/variable/dynamic_test.go (new TestRegistry_FakerFile* tests
    including default-imageUrl, custom-imageUrl, bad-input cases,
    seeded-reproducibility, no-seed-entropy)
  - docs/MANUAL.md §3.7 (4 new rows; $faker.imageUrl row shows both
    default and arg-bearing forms)

  Not in scope: locale-specific filename conventions; image-URL
  alternatives beyond picsum.photos; format-specific extension/MIME pairing
  beyond the shipped pool. Spec citations: SPECIFICATION.md:838–845.
