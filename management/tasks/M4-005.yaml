id: M4-005
title: "Web: team test results dashboard page"
status: done
priority: 2
created: 2026-04-14
phase: "M4: Team Tier"
dependencies:
  - M4-004
observable: |
  cd web && npm install && npm run build
  npm run test:e2e -- tests/e2e/org-results.spec.ts
  # Expected: Playwright run OK, >=5 passing. The spec:
  #   1. logs in as owner via seeded magic link
  #   2. navigates to /org/acme/results
  #   3. asserts total runs, pass/fail counts, pass rate %, trend chart
  #   4. asserts the recent runs table renders rows seeded by M4-004 fixtures
  # Runs against a docker-compose stack (backend + web) started by the spec's
  # beforeAll using scripts/test-stack.sh up.
behaviors:
  - "Given an authenticated team-tier org owner, when they navigate to /org/[slug]/results, then the page renders total runs, pass count, fail count, pass rate %, and average duration"
  - "Given at least two seeded runs from M4-004 fixtures, when the results page loads, then the recent runs table shows rows in newest-first order with date, file name, user, pass count, and duration"
  - "Given the backend returns an empty results list, when the page loads, then an empty state component is shown with a 'Run apitest and upload results to get started' message"
  - "Given a member of a non-team-tier org, when they navigate to /org/[slug]/results, then they are redirected to /org/[slug] and shown a 'Team tier required' toast"
  - "Given the user selects '7 days' in the time-range picker, when applied, then the API call includes ?range=7d and the chart updates accordingly"
  - "Given the backend returns 500, when the page tries to load results, then an error state with a retry button is shown and no dashboard widgets render"
  - "Given the route file exists, when running svelte-check, then there are no type errors in +page.svelte or +page.server.ts"
scope: |
  New SvelteKit route web/src/routes/(app)/org/[slug]/results/+page.svelte
  and its +page.server.ts loader. Add web/src/lib/api/results.ts typed client
  that calls the M4-004 endpoints via the fetch wrapper. Guards: require
  team-tier via the RequireTeamTier layout guard described in the spec. Tests
  live in web/tests/e2e/org-results.spec.ts using Playwright and
  scripts/test-stack.sh to bring up a docker-compose stack of backend + web.
definition_of_done:
  - "Playwright spec passes with >=5 assertions including empty-state and error-state paths"
  - "svelte-check and npm run lint pass cleanly"
  - "docker-compose test stack script checked in under scripts/test-stack.sh"
  - "Route appears in the org sub-navigation only for team-tier users"
  - "Type definitions for Result/ResultSummary shared in web/src/lib/types/results.ts"
  - "README under web/ documents how to run the e2e spec locally"
complexity: high
estimated_effort: "8-12 hours"
track: web
