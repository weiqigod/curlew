  - "go test ./... passes"
  - "go test -cover ./internal/variable/... >= 80%"
  - "golangci-lint run passes with 0 issues"
  - "./smoke/run.sh passes"
  - "./scripts/ci-local.sh passes"
  - "docs/MANUAL.md dynamic-functions table updated with $urlEncode and $jsonEncode rows"
complexity: low
