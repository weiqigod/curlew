  - "Live HTTP probe with valid X-Hub-Signature-256 returns 200; duplicate delivery returns 200 with no second row"
  - "EF Core migration 0018_github_webhook_events committed"
  - "Migration 0018_github_webhook_events applied to staging DB and rolled back cleanly"
  - "Multi-secret rotation covered by a test (old + new both accepted)"
  - "Constant-time signature compare verified (CryptographicOperations.FixedTimeEquals)"
  - "Quarantine budget covered by a test (5 failures → status='quarantined')"
  - "Legacy SHA-1 header explicitly rejected by a negative test"
  - "docs/SPECIFICATION.md:8551–8597 cited in GitHubWebhookEndpoint.cs header"
complexity: high
