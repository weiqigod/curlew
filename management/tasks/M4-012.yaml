id: M4-012
title: "E2E: CLI run -> backend ingest -> web dashboard"
status: done
priority: 2
created: 2026-04-14
phase: "M4: Team Tier"
dependencies:
  - M4-005
  - M4-007
observable: |
  scripts/test-stack.sh up           # starts backend + web + postgres via docker-compose
  go build ./cmd/apitest
  APITEST_BACKEND_URL=http://localhost:5000 \
  APITEST_BACKEND_TOKEN=$(scripts/test-token.sh owner@example.com) \
    ./apitest run testdata/team/e2e-collection.yaml --report-upload \
      --org acme --pr 7 --repo acme/api
  # Expected: exit 0, stdout "Uploaded result res_...; status posted"
  cd web && npm run test:e2e -- tests/e2e/full-pipeline.spec.ts
  # Expected: Playwright >=4 passing:
  #   - navigates to /org/acme/results and asserts the run just uploaded is listed
  #   - asserts pass/fail counts match the CLI output
  #   - confirms pr-check row shows in /org/acme/pr-checks
  scripts/test-stack.sh down
behaviors:
  - "Given the docker-compose stack is up, when the CLI runs a collection with --report-upload and a valid backend token, then the run completes, the results appear in the backend results list, and the CLI exits 0"
  - "Given a CLI run that uploaded a result, when Playwright navigates to /org/[slug]/results, then the uploaded run is visible in the recent runs table within 5 seconds"
  - "Given the upload included --pr and --repo, when the web portal loads, then the pr-check row is visible with state=success"
  - "Given a collection with a deliberately failing test, when apitest run --report-upload is invoked, then the CLI exits 1, the backend status is failure, and the dashboard shows the failure badge"
  - "Given scripts/test-stack.sh up is run twice, when the second invocation starts, then it detects an existing stack and re-seeds the dev org without duplicating rows"
  - "Given scripts/test-stack.sh down is run after the spec, when invoked, then all containers stop and the test database volume is removed"
  - "Given svelte-check and golangci-lint run on the touched files, then no issues are reported"
scope: |
  Glue slice. No new backend endpoints, no new CLI commands. Wire the
  existing apitest run pipeline to --report-upload so a single CLI invocation
  uploads results and posts a pr-check (reusing M4-007's internal/prcheck
  package). Ship testdata/team/e2e-collection.yaml and
  web/tests/e2e/full-pipeline.spec.ts. Extend scripts/test-stack.sh to seed
  one team-tier org and one API token. This is the convergence slice that
  proves all three tracks work together end-to-end.
definition_of_done:
  - "Full-pipeline Playwright spec passes with >=4 assertions"
  - "apitest run --report-upload documented in help text"
  - "scripts/test-stack.sh up/down covered by a smoke test in smoke/run.sh"
  - "E2E fixture checked in and referenced from both CLI and web tests"
  - "CI job e2e-m4 added that runs the full pipeline on a Linux runner"
  - "Failure path (collection with failing test) covered"
complexity: high
estimated_effort: "8-12 hours"
track: web
