id: M17-003
title: "OAuth 1.0a signer (`type: oauth1`) with HMAC-SHA1 default and HMAC-SHA256 opt-in"
status: done
priority: 2
created: 2026-04-28
phase: "M17: First-party signers and signing helpers"
track: go-cli
dependencies:
  - M17-001
observable: |
  go build ./cmd/curlew

  go test -run 'TestOAuth1_HMACSHA1_RFC5849Vector' -v ./internal/signer/oauth1/...
  # Expected: PASS — using the RFC 5849 §3.4.1.1 base-string-construction
  # example (POST https://photos.example.net/initiate, consumer_key=dpf43f3p2l4k3l03,
  # consumer_secret=kd94hf93k423kf44, oauth_nonce=wIjqoS, oauth_timestamp=137131200,
  # oauth_callback=http://printer.example.com/ready), the computed
  # signature-base-string and the HMAC-SHA1 signature match the values
  # tabulated in the RFC.

  go test -run 'TestOAuth1_DefaultMethodIsHMACSHA1' -v ./internal/signer/oauth1/...
  # Expected: PASS — when the signing spec omits `method:`, the signer uses
  # HMAC-SHA1 and emits oauth_signature_method="HMAC-SHA1" in the
  # Authorization header.

  go test -run 'TestOAuth1_HMACSHA256_OptIn' -v ./internal/signer/oauth1/...
  # Expected: PASS — when the signing spec sets `method: HMAC-SHA256`, the
  # signer uses HMAC-SHA256 and emits oauth_signature_method="HMAC-SHA256";
  # the base string is unchanged from the HMAC-SHA1 case (algorithm-only swap).

  go test -run 'TestOAuth1_RejectsUnsupportedMethods' -v ./internal/signer/oauth1/...
  # Expected: PASS — when method is "RSA-SHA1" or "PLAINTEXT" or any other
  # value, the registry returns a structured CategoryInput error with code
  # SIGNER_OAUTH1_UNSUPPORTED_METHOD listing the two supported values
  # (HMAC-SHA1, HMAC-SHA256).

  go test -run 'TestOAuth1_AuthorizationHeaderShape' -v ./internal/signer/oauth1/...
  # Expected: PASS — the injected Authorization header begins with
  # `OAuth ` and contains comma-separated key="value" pairs in this fixed
  # alphabetical order: oauth_consumer_key, oauth_nonce, oauth_signature,
  # oauth_signature_method, oauth_timestamp, oauth_token (when present),
  # oauth_version="1.0"; values are RFC 3986 percent-encoded and quoted.

  go test -run 'TestOAuth1_SecretsSensitivePropagation' -v ./internal/signer/oauth1/...
  # Expected: PASS — both consumer_secret and (when set) token_secret, when
  # resolved from sensitive variables, are added via sensitives.AddValue(...)
  # so they are redacted in serialised output.

  TMP=$(mktemp -d); cd "$TMP"; ./curlew init demo && cd demo
  # Add oauth1 signing block to a request (with consumer_key/secret env vars).
  ./curlew run collections/sample.yaml --dry-run --format json | jq -r '.requests[0].headers.Authorization' | head -c 6
  # Expected output: OAuth\n

  go test ./...
  # Expected: PASS.
behaviors:
  - "Given the RFC 5849 §3.4.1.1 example (POST https://photos.example.net/initiate, consumer_key=dpf43f3p2l4k3l03, consumer_secret=kd94hf93k423kf44, oauth_nonce=wIjqoS, oauth_timestamp=137131200, oauth_callback=http://printer.example.com/ready), when the OAuth1 signer constructs the signature base string, then it equals the value tabulated in the RFC; the resulting HMAC-SHA1 oauth_signature equals the value tabulated in the RFC."
  - "Given a signing spec that omits method, when the signer runs, then oauth_signature_method emitted in the Authorization header is exactly HMAC-SHA1 (default per Open Decision #3)."
  - "Given a signing spec with method: HMAC-SHA256, when the signer runs, then oauth_signature_method emitted is HMAC-SHA256 and the signature uses crypto/hmac with sha256.New."
  - "Given a signing spec with method set to RSA-SHA1, PLAINTEXT, or any value other than HMAC-SHA1 or HMAC-SHA256, when the registry resolves the spec, then it returns a structured CategoryInput error with code SIGNER_OAUTH1_UNSUPPORTED_METHOD listing the supported values, before any HTTP request is dispatched."
  - "Given a request with both query-string and form-body parameters, when the signature base string is constructed, then both parameter sources are merged and lex-sorted by key then by value, with each name and value RFC 3986 percent-encoded (per RFC 5849 §3.4.1.3.2)."
  - "Given the signer injects oauth_nonce, when the spec does not pre-specify a nonce, then the nonce is at least 16 chars of base32-encoded crypto/rand bytes; oauth_timestamp defaults to the configured clock (the constructor accepts an optional now func, defaulting to time.Now) so tests can pin both to RFC vectors."
  - "Given consumer_secret and (optionally) token_secret resolve from sensitive variables, when Sign runs, then sensitives.AddValue(resolved_consumer_secret) and sensitives.AddValue(resolved_token_secret) are called so they are redacted in serialised output."
  - "Given the resulting Authorization header, when inspected, then it starts with `OAuth ` and contains key=\"value\" pairs in alphabetical order by key (oauth_consumer_key first), comma-separated, with values RFC 3986 percent-encoded and double-quoted, exactly as required by RFC 5849 §3.5.1."
scope: |
  Implements the second concrete signer behind M17-001's registry. New
  package internal/signer/oauth1/. Standard-library-only implementation
  (crypto/hmac, crypto/sha1, crypto/sha256, crypto/rand, encoding/base32,
  net/url, sort, strings).

  Init-time registration: package init() in internal/signer/oauth1/
  registers the type via signer.Register("oauth1", oauth1.Factory). The
  CLI's main package imports the oauth1 subpackage so the registration
  runs at startup.

  Required params:
    - consumer_key      (string, required, supports {{interpolation}})
    - consumer_secret   (string, required, supports {{interpolation}})

  Optional params:
    - token             (string, supports {{interpolation}})
    - token_secret      (string, supports {{interpolation}})
    - method            (string, default HMAC-SHA1; only HMAC-SHA1 and HMAC-SHA256 accepted; RSA-SHA1 and PLAINTEXT rejected per Open Decision #3)
    - realm             (string, optional, included in the Authorization header when set)

  Sign sequence:
    1. Resolve all params via standard variable-interpolation chain.
    2. Generate oauth_nonce (≥16 chars base32(crypto/rand)) and oauth_timestamp
       (clock.Now().Unix()), unless the spec pre-specifies them (test seam).
    3. Build the parameter list: oauth_consumer_key, oauth_nonce,
       oauth_signature_method, oauth_timestamp, oauth_token (if set),
       oauth_version=1.0, plus all query-string and form-body params.
    4. Construct the signature base string per RFC 5849 §3.4.1
       (HTTP method UPPER, base URL minus query, lex-sorted percent-encoded
       params concatenated).
    5. Construct the signing key: percent-encoded consumer_secret + "&" +
       percent-encoded token_secret (token_secret may be empty).
    6. Compute HMAC-SHA1 (default) or HMAC-SHA256 (opt-in) signature over
       the base string with the signing key; base64-encode the digest.
    7. Inject Authorization header: `OAuth realm="...", oauth_consumer_key="...",
       oauth_nonce="...", oauth_signature="...", oauth_signature_method="...",
       oauth_timestamp="...", oauth_token="...", oauth_version="1.0"` —
       alphabetically sorted by key, percent-encoded values, double-quoted.
    8. Call sensitives.AddValue(consumer_secret_resolved) and
       sensitives.AddValue(token_secret_resolved) when non-empty.

  Clock + nonce seam: per the M17-001 contract, the Signer interface
  does not carry a clock argument. M17-003's Factory accepts a
  `WithClock(now func() time.Time)` option (defaulting to time.Now)
  AND a `WithNonceSource(rand io.Reader)` option (defaulting to
  crypto/rand.Reader); both default at construction time. Tests pin
  both to the RFC 5849 vector values via these options.

  Files touched:
    - internal/signer/oauth1/oauth1.go         (new — OAuth1 implementation)
    - internal/signer/oauth1/oauth1_test.go    (new — RFC 5849 vectors + arity/method/error cases)
    - internal/signer/oauth1/testdata/         (new — base-string and final-header diff fixtures)
    - cmd/curlew/main.go                      (one-line blank import: _ "github.com/weiqigod/curlew/internal/signer/oauth1")
    - docs/MANUAL.md                           (one row added to the signing-types table introduced in M17-001; calls out HMAC-SHA1 default and HMAC-SHA256 opt-in)

  Files explicitly NOT touched:
    - internal/signer/signer.go                (M17-001 is the sole author of the registry interface)
    - internal/signer/awssigv4/                (M17-002 owns SigV4)
    - internal/variable/*                      (no dynamic-function changes)
    - internal/auth/profile.go                 (unchanged across all of M17)

  Not in scope: RSA-SHA1 (requires PEM-key handling — separate concern,
  per Open Decision #3); PLAINTEXT (security footgun, per Open Decision
  #3); OAuth1 token-fetching dance (request-token / authorize / access-token
  flow — users supply tokens via the standard variable-interpolation
  chain); SPECIFICATION.md v4.2 update for `signing:` (separate follow-up).
