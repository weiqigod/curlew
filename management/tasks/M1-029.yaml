dependencies: [M1-003]
observable: |
  Create collection with >1000 requests (or mock the counter). Run and verify
  it stops at 1000 with exit code 2.
behaviors:
  - "Given a collection with 999 requests, when executed, then all requests run normally"
  - "Given a collection exceeding 1,000 requests, when the limit is reached, then execution stops with exit code 2"
  - "Given the 1,000-request limit is hit, when displayed, then message suggests splitting into multiple collections"
  - "Given requests across setup, main, and teardown, when counted, then all count toward the limit"
  - "Given the limit is reached mid-execution, when stopped, then summary includes requests completed before the limit"
scope: |
  Add request counter to execution pipeline. Implement limit check. Add exit
  code 2 for limit exceeded. Include helpful message.
