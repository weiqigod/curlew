scope: |
  Move the embedded collection schema to schemas/collection-v1.json. New
  repo-root package schemas/ owns the //go:embed. internal/schema/schema.go
  becomes a one-line alias (var CollectionSchema = schemas.CollectionV1).
  Add $id and bump title to 'ApiTest Collection v1'. Document the VS Code
  yaml.schemas snippet in MANUAL.md §1.5. Add four tests: DoD sample-validates,
  negative control, drift guard, file-exists. CHANGELOG entry.

  Rationale for the sibling-package approach: //go:embed cannot use '..',
  so a file at the repo root cannot be embedded directly from within
  internal/schema/. The cleanest solution is a new schemas/ package at
  the repo root owning the embed; internal/schema/schema.go aliases its
  exported byte slice to preserve the public symbol name.

  Not in scope (deferred to M8-002): adding auth, retry (3 levels),
  data_driven, section object form, variables object form, and
  constraining assertions.status to oneOf[integer, array[integer]].
  Not in scope (permanent per IMPROVEMENT.md §7): auto-writing
  .vscode/settings.json, VS Code extension / LSP, restricting
  request.method to an enum.
